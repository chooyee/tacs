<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaaS Approval Checklist</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f5; --border:#d9dee6; --text:#1a1f26; --muted:#5b6573;
  --accent:#2453d4; --accent-ink:#ffffff; --accent-soft:#e6edfc;
  --ok:#17794a; --ok-soft:#e1f3e9; --bad:#c2352a; --bad-soft:#fbe6e4; --warn:#a05f00; --warn-soft:#fcf0da;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#161a21; --surface-2:#1e232b; --border:#2b323c; --text:#e6e9ee; --muted:#9aa4b2;
    --accent:#7096ff; --accent-ink:#0a1020; --accent-soft:#1b2846;
    --ok:#4cc38a; --ok-soft:#12301f; --bad:#ff7b72; --bad-soft:#3a1714; --warn:#e5a54b; --warn-soft:#38290f;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161a21; --surface-2:#1e232b; --border:#2b323c; --text:#e6e9ee; --muted:#9aa4b2;
  --accent:#7096ff; --accent-ink:#0a1020; --accent-soft:#1b2846;
  --ok:#4cc38a; --ok-soft:#12301f; --bad:#ff7b72; --bad-soft:#3a1714; --warn:#e5a54b; --warn-soft:#38290f;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:22px;margin:0;line-height:1.25}
h2{font-size:16px;margin:0 0 4px}
h3{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar .in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;display:flex;align-items:center;gap:8px;color:var(--text)}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px}
.brand small{font-weight:400;color:var(--muted)}
.spacer{flex:1}
.role{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.role select{padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}

.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible,.yn button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.draft{background:var(--surface-2);color:var(--muted)}
.chip.submitted{background:var(--accent-soft);color:var(--accent)}
.chip.approved{background:var(--ok-soft);color:var(--ok)}
.chip.conditions{background:var(--warn-soft);color:var(--warn)}
.chip.resubmit{background:var(--bad-soft);color:var(--bad)}
.gtag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px;letter-spacing:.02em}

/* dashboard */
.page-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.page-head .sub{color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px}
.dash{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.listhead{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.listhead input,.listhead select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.listhead input{flex:1;min-width:160px}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) 110px 150px 90px 170px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.h{cursor:default;background:none;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:8px;padding-bottom:8px}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:12.5px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.ok>i{background:var(--ok)}
.num-tab{font-variant-numeric:tabular-nums}
.gscore b{font-variant-numeric:tabular-nums}
.gscore.bad b{color:var(--bad)}
.gscore.ok b{color:var(--ok)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.insight .it{display:grid;grid-template-columns:1fr 70px 22px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.insight .bar>i{background:var(--bad)}

/* editor */
.crumbs{margin-bottom:10px;font-size:13px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13.5px}
.banner.info{background:var(--accent-soft);color:var(--text)}
.banner.warn{background:var(--warn-soft)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding:16px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.field label .req{color:var(--bad)}
.field input,.field textarea,.field select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.field input:read-only,.field textarea:read-only{background:var(--surface-2)}
.field input:focus,.field textarea:focus,.remark:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

.ctl{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);align-items:start;scroll-margin-top:80px}
.ctl:last-child{border-bottom:0}
.ctl .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:5px}
.ctl .lbl{padding-top:4px;font-weight:500}
.ctl.no{background:linear-gradient(90deg,var(--bad-soft),transparent 60%)}
.ctl.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-soft)}100%{box-shadow:none}}
.remark{width:100%;margin-top:8px;padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);font-size:13px}
.ctl.need .remark{border-color:var(--bad);background:var(--bad-soft)}
.ctl .err{color:var(--bad);font-size:12px;margin-top:4px;display:none}
.ctl.need .err{display:block}
.yn{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.yn button{border:0;background:var(--surface);padding:6px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.yn button+button{border-left:1px solid var(--border)}
.yn button[aria-pressed="true"].y{background:var(--ok);color:#fff}
.yn button[aria-pressed="true"].x{background:var(--bad);color:#fff}
.yn button[aria-pressed="true"].na{background:var(--muted);color:var(--surface)}
.ctl.na .lbl{color:var(--muted)}
.ctl.na .lbl::after{content:" (not applicable)";font-size:12px;font-style:italic}

/* AI pre-check */
.ai-hint{margin-top:8px;font-size:12.5px;padding:6px 10px;border-radius:7px;background:var(--accent-soft);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ai-hint.conflict{background:var(--warn-soft)}
.ai-hint.none{background:var(--surface-2);color:var(--muted)}
.ai-hint q{font-style:italic;color:var(--muted)}
.spark{color:var(--accent);font-weight:700}
.docs{list-style:none;margin:0 16px 8px;padding:0}
.docs li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.docs li:last-child{border-bottom:0}
.dtype{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.xbtn{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.steps{list-style:none;margin:0;padding:14px 16px;display:grid;gap:6px;font-size:13px}
.steps li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.steps li.done{color:var(--text)}
.steps li.cur{color:var(--accent);font-weight:600}
.verdict{margin:16px;padding:14px 16px;border-radius:10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.verdict.ok{background:var(--ok-soft)} .verdict.no{background:var(--bad-soft)}
.verdict .big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.verdict b{display:block;font-size:15px}
.sev{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.sev.blocking{background:var(--bad);color:#fff} .sev.major{background:var(--warn-soft);color:var(--warn)} .sev.minor{background:var(--surface-2);color:var(--muted)}
.finding{padding:12px 16px;border-top:1px solid var(--border);display:grid;gap:6px}
.finding.dismissed{opacity:.6}
.finding .fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cite{font-size:12.5px;border-left:3px solid var(--accent);padding:2px 10px;color:var(--muted)}
.cite b{color:var(--text);font-weight:600}
.subhead{padding:12px 16px 6px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.yn button:disabled{cursor:default}

/* sign-off */
.so{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.3fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:center}
.so.h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:8px;padding-bottom:8px}
.signed{color:var(--ok);font-weight:600}
.signed small{display:block;color:var(--muted);font-weight:400}
.blockers{margin:0;padding:12px 16px 12px 34px;background:var(--warn-soft);border-top:1px solid var(--border);font-size:13px}
.blockers li{margin:2px 0}
.decision{padding:16px;display:grid;gap:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.history{list-style:none;margin:0;padding:8px 16px 14px}
.history li{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px}
.history li:last-child{border-bottom:0}

/* aside */
aside{position:sticky;top:70px;display:grid;gap:12px}
.ring{display:flex;gap:14px;align-items:center}
.ring svg{flex:none}
.stats{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}
.gates{list-style:none;margin:0;padding:0}
.gates li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.gates li:hover{background:var(--surface-2)}
.ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;color:#fff}
.ic.pass{background:var(--ok)} .ic.fail{background:var(--bad)} .ic.pending{background:transparent;border:2px dashed var(--border)}
.ready{padding:12px 14px;border-radius:8px;font-weight:600;font-size:13.5px}
.ready.ok{background:var(--ok-soft);color:var(--ok)}
.ready.no{background:var(--bad-soft);color:var(--bad)}
.ready small{display:block;font-weight:400;color:var(--text);opacity:.85;margin-top:2px}

/* print report */
.report{background:#fff;color:#111;max-width:900px;margin:0 auto;padding:28px;border:1px solid var(--border);border-radius:var(--radius)}
.report h1{font-size:20px}
.report table{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:12.5px}
.report th,.report td{border:1px solid #bbb;padding:5px 7px;text-align:left;vertical-align:top}
.report th{background:#eef0f3}
.report .sec{font-weight:700;margin-top:14px}
.report .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin:12px 0 18px;font-size:13px}
.report .gatesgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px;font-size:13px}
.report .y{color:#17794a;font-weight:700}.report .x{color:#c2352a;font-weight:700}

/* long-form: sticky section bar */
.secbar{position:sticky;top:var(--tb,50px);z-index:15;background:var(--bg);padding:10px 0;margin:0 0 14px;border-bottom:1px solid var(--border)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.cn{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border:1px solid var(--border);background:var(--surface);border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--text);flex:none}
.cn:hover{border-color:var(--accent)}
.cn .k{min-width:22px;height:22px;border-radius:999px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:11.5px;padding:0 6px}
.cn .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cn.done .k{background:var(--ok);color:#fff}
.cn.done .st{color:var(--ok);font-weight:700}
.cn.warn .k{background:var(--bad);color:#fff}
.cn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.cn.off{opacity:.55;border-style:dashed}
.cn.off .nm{text-decoration:line-through}
.cn:focus-visible,.seg button:focus-visible,.go:focus-visible,.icon-btn:focus-visible,.chev:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg b{font-variant-numeric:tabular-nums;margin-left:5px;font-weight:600}
.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;width:300px;max-width:calc(100vw - 32px)}
.menu-pop label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.menu-pop label:hover{background:var(--surface-2)}
.menu-pop .mf{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--border);margin-top:6px;padding:6px 2px 0}
.k-sm{width:20px;height:20px;border-radius:5px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}

/* long-form: section cards */
.form-stack{display:grid;gap:14px;min-width:0}
.legend{font-size:12.5px;color:var(--muted);display:flex;gap:6px 16px;flex-wrap:wrap}
.legend b{color:var(--text)}
.seccard{scroll-margin-top:calc(var(--tb,50px) + var(--sb,96px) + 10px);overflow:visible}
.sec-head{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;user-select:none;border-radius:var(--radius)}
.sec-head:hover{background:var(--surface-2)}
.seccard:not(.collapsed) .sec-head{border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0}
.sec-head .letter{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--accent-soft);color:var(--accent);flex:none}
.sec-head.done .letter{background:var(--ok);color:#fff}
.sec-head .t{flex:1;min-width:0}
.sec-head h2{margin:0;font-size:15px}
.sec-head .meta{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--bad-soft);color:var(--bad)}
.bar.mini{width:64px;flex:none}
.chev{border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;padding:4px;transition:transform .15s}
.collapsed .chev{transform:rotate(-90deg)}
.collapsed .sec-body{display:none}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:5px 7px;border-radius:6px;font-size:12.5px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.sec-tools{display:flex;justify-content:flex-end;padding:8px 16px 0}
.filter-note{padding:12px 16px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card-desc{padding:12px 16px 0}
.linkish{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font:inherit;font-weight:600}
.linkish:hover{text-decoration:underline}

/* summary rail */
aside{top:calc(var(--tb,50px) + var(--sb,96px) + 14px);max-height:calc(100vh - var(--tb,50px) - var(--sb,96px) - 28px);overflow:auto}
.sumlist{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--border)}
.sumlist li{display:flex;align-items:center;gap:2px}
.sumlist .go{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;padding:5px 6px;border-radius:6px;cursor:pointer;text-align:left;font-size:13px;min-width:0;color:var(--text)}
.sumlist .go:hover{background:var(--surface-2)}
.sumlist .k{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);flex:none}
.sumlist .done .k{background:var(--ok);color:#fff}
.sumlist .warn .k{background:var(--bad);color:#fff}
.sumlist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sumlist .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sumlist .done .st{color:var(--ok);font-weight:600}
.sumlist .warn .st{color:var(--bad)}
.sumlist li.off .nm{text-decoration:line-through;color:var(--muted)}
button.ready{width:100%;border:0;text-align:left;cursor:pointer;font:inherit;font-weight:600}

/* AI assistant */
.fab{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer}
.fab[hidden]{display:none}
.fab .badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px}
.fab .badge.ok{background:var(--ok)}

/* Freeze a published collection into a submission template: sections are lettered A, B, C…
   and standards numbered 1…N so the paper reads like the one-page form. */
function snapshot(c){
  const def = c.published; let n = 0; const byRef = {};
  const sections = def.sections.map((sec, i) => ({ id:String.fromCharCode(65 + i), title:sec.title, short:sec.short || sec.title,
    controls:sec.controls.map(k => { byRef[k.id] = ++n; return [n, k.text, k.id]; }) }));
  const gates = def.gates.map(g => ({ id:g.id, name:g.name, expect:g.expect || '', ...(g.signoff ? { signoff:'sec' } : {}),
    controls:g.controls.map(r => byRef[r]).filter(Boolean) })).filter(g => g.controls.length);
  return { colId:c.id, name:c.name, version:c.version, sections, gates, artefacts:[...def.artefacts] };
}

/* The checklist helpers below read these module-level views of "the current paper's
   template". useTemplate() points them at a submission's snapshot; every entry point
   that works on a submission calls it first (rendering is synchronous, so this is safe). */
let SECTIONS, GATES, ALL_CONTROLS, GATES_BY_CONTROL, REQUIRED_ARTEFACTS, SECS, boundTpl;
function useTemplate(s){
  const t = s.template;
  if (!t || t === boundTpl) return;
  boundTpl = t;
  SECTIONS = t.sections; GATES = t.gates; REQUIRED_ARTEFACTS = t.artefacts;
  ALL_CONTROLS = SECTIONS.flatMap(sec => sec.controls.map(([n, txt, ref]) => ({ n, t:txt, ref, section:sec.id })));
  GATES_BY_CONTROL = {};
  GATES.forEach(g => g.controls.forEach(n => (GATES_BY_CONTROL[n] ||= []).push(g)));
  SECS = [
    { id:'info', key:'i', name:'Project information', short:'Project info' },
    ...SECTIONS.map(x => ({ id:x.id, key:x.id, name:x.title, short:x.short })),
    { id:'signoff', key:String.fromCharCode(65 + SECTIONS.length), name:'Readiness declaration & decision', short:'Sign-off' },
  ];
}
const tplLabel = s => `${s.template.name} v${s.template.version}`;
const precheckSteps = () => ['Extracting text from documents','Classifying artefacts',`Mapping evidence to ${ALL_CONTROLS.length} standards`,`Checking ${GATES.length} mandatory gates`,'Reviewing remark quality'];

/* ============================================================
   Derived metrics
   ============================================================ */
function gateStatus(s, g){
  const vals = g.controls.map(n => s.answers[n]?.v);
  if (vals.includes('no')) return 'fail';
  // N/A satisfies a gate only because it always carries a justification (and Security sign-off)
  if (vals.every(v => v === 'yes' || v === 'na') && (!g.signoff || s.signoffs[g.signoff])) return 'pass';
  return 'pending';
}

/* ---------- AI pre-check derivations ---------- */
const docSig = docs => docs.map(d => d.name).sort().join('|');

const hashStr = str => [...str].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);
function runMockEngine(s, docs){
  useTemplate(s);
  const results = {};
  ALL_CONTROLS.forEach(({ n, ref, t }) => {
    const known = s.template.colId === 'saas' && KB[ref];
    if (known) {
      const [type, page, quote, suggest, conf, note] = known;
      const doc = docs.find(d => d.type === type);
      results[n] = doc ? { suggest, conf, note, cite:{ doc:doc.name, page, quote } } : { suggest:null };
      return;
    }
    // no canned evidence: pretend roughly 3 in 4 standards are covered somewhere in the pack
    const h = hashStr(ref + docs.length);
    const doc = docs[h % Math.max(1, docs.length)];
    results[n] = doc && h % 4 ? { suggest:'yes', conf:62 + h % 33, cite:{ doc:doc.name, page:1 + h % 40, quote:`Addresses: “${t}”.` } } : { suggest:null };
  });
  return results;
}

function precheckFindings(s){
  useTemplate(s);
  const p = s.precheck;
  if (!p?.results) return [];
  const out = [];
  ALL_CONTROLS.forEach(({ n }) => {
    const r = p.results[n], a = s.answers[n] || {};
    const gate = !!GATES_BY_CONTROL[n];
    if (!r.suggest) {
      if (a.v === 'yes') out.push({ id:'c'+n, n, sev:gate ? 'blocking' : 'major', kind:'Unsupported claim',
        msg:'Answered Yes, but no supporting evidence was found in the paper pack.' });
      else if (!a.v) out.push({ id:'c'+n, n, sev:'minor', kind:'No evidence found',
        msg:'Nothing in the paper pack addresses this control. Add the artefact or answer manually.' });
    } else if (a.v && a.v !== r.suggest) {
      out.push({ id:'c'+n, n, r, sev:gate ? 'blocking' : 'major', kind:'Conflicts with evidence',
        msg:`Answered ${ANSWER_LABEL[a.v]}, but the paper pack indicates ${ANSWER_LABEL[r.suggest]}${r.note ? ' — ' + r.note : ''}.` });
    }
    if ((a.v === 'no' || a.v === 'na') && a.r?.trim() && (VAGUE.test(a.r.trim()) || a.r.trim().length < 15))
      out.push({ id:'q'+n, n, sev:'minor', kind:'Vague remark',
        msg:`“${a.r.trim()}” is not committee-standard. State the gap, remediation owner and target date.` });
  });
  REQUIRED_ARTEFACTS.forEach(t => {
    if (!p.docs.some(d => d.type === t)) out.push({ id:'a'+t, sev:'major', kind:'Missing artefact',
      msg:`${DOC_TYPES[t]} is a required artefact for a standard Solution Lab paper.` });
  });
  const rank = { blocking:0, major:1, minor:2 };
  return out.map(f => ({ ...f, dismissed:p.dismissed?.[f.id] }))
            .sort((a, b) => !!a.dismissed - !!b.dismissed || rank[a.sev] - rank[b.sev] || (a.n || 99) - (b.n || 99));
}

function precheckSummary(s){
  const p = s.precheck;
  const ran = !!p?.results;
  const stale = ran && docSig(p.docs) !== p.ranSig;
  const f = precheckFindings(s).filter(x => !x.dismissed);
  const c = sev => f.filter(x => x.sev === sev).length;
  const blocking = c('blocking'), major = c('major'), minor = c('minor');
  const score = ran ? Math.max(0, 100 - blocking*15 - major*6 - minor*2) : null;
  return { ran, stale, blocking, major, minor, score, open:f.length };
}

function metrics(s){
  useTemplate(s);
  const ans = n => s.answers[n]?.v;
  const answered = ALL_CONTROLS.filter(c => ans(c.n)).length;
  const yes = ALL_CONTROLS.filter(c => ans(c.n) === 'yes').length;
  const no  = ALL_CONTROLS.filter(c => ans(c.n) === 'no').length;
  const na  = ALL_CONTROLS.filter(c => ans(c.n) === 'na').length;
  const missingRemarks = ALL_CONTROLS.filter(c => (ans(c.n) === 'no' || ans(c.n) === 'na') && !s.answers[c.n].r.trim()).map(c => c.n);
  const gates = GATES.map(g => ({ ...g, st:gateStatus(s, g) }));
  const gPass = gates.filter(g => g.st === 'pass').length;
  const gFail = gates.filter(g => g.st === 'fail');
  const infoMissing = INFO_FIELDS.filter(f => !String(s.info[f.key] || '').trim()).map(f => f.label);
  const preSign = SIGNOFFS.filter(x => x.id !== 'pm' && !s.signoffs[x.id]).map(x => x.owner);

  const blockers = [];
  if (infoMissing.length) blockers.push(`Project info incomplete: ${infoMissing.join(', ')}`);
  if (answered < ALL_CONTROLS.length) blockers.push(`${ALL_CONTROLS.length - answered} control(s) not answered`);
  if (missingRemarks.length) blockers.push(`Remarks required for "No" / "N/A" on #${missingRemarks.join(', #')}`);
  if (gFail.length) blockers.push(`Mandatory gate(s) failing: ${gFail.map(g => g.name).join(', ')}`);
  const pc = precheckSummary(s);
  if (!pc.ran) blockers.push('AI pre-check has not been run');
  else if (pc.stale) blockers.push('AI pre-check is out of date — paper pack changed since last run');
  else if (pc.blocking) blockers.push(`${pc.blocking} blocking AI pre-check finding(s) unresolved`);
  if (preSign.length) blockers.push(`Awaiting sign-off: ${preSign.join(', ')}`);

  return { answered, yes, no, na, total:ALL_CONTROLS.length, pct:Math.round(answered / ALL_CONTROLS.length * 100),
           missingRemarks, gates, gPass, gFail, blockers, ready:!blockers.length };
}

  const rows = state.subs
    .filter(s => ctx.f === 'all' || s.status === ctx.f)
    .filter(s => !ctx.fc || ctx.fc === 'all' || s.template.colId === ctx.fc)
    .filter(s => !q || Object.values(s.info).join(' ').toLowerCase().includes(q) || s.id.toLowerCase().includes(q))
    .sort((a,b) => b.updatedAt - a.updatedAt);
  if (!rows.length) return `<div class="empty">No submissions match.</div>`;
  return `<div class="row h"><span>Project</span><span class="c-date">Lab date</span><span class="c-prog">Checklist</span><span>Gates</span><span>Status</span></div>` +
    rows.map(s => {
      const m = metrics(s);
      return `<div class="row" data-action="open" data-id="${s.id}" tabindex="0" role="link">
        <div><div class="t">${esc(s.info.project || 'Untitled submission')}</div><div class="s"><span class="ctag">${esc(tplLabel(s))}</span> ${esc(s.info.vendor || '—')} · ${s.id}</div></div>
        <div class="c-date num-tab">${fmtDate(s.info.labDate)}</div>
        <div class="c-prog"><div class="bar ${m.pct === 100 ? 'ok' : ''}"><i style="width:${m.pct}%"></i></div><div class="s num-tab">${m.answered}/${m.total} answered</div></div>
        <div class="gscore ${m.gFail.length ? 'bad' : m.gPass === m.gates.length ? 'ok' : ''}"><b>${m.gPass}</b>/${m.gates.length}${m.gFail.length ? ` <span class="s">· ${m.gFail.length} fail</span>` : ''}</div>
        <div>${statusChip(s.status)}</div>
      </div>`;
    }).join('');
}

/* ---------- Long-form editor: section model (SECS comes from useTemplate) ---------- */
const FILTERS = [
  { id:'all',       label:'All' },
  { id:'open',      label:'Unanswered' },
  { id:'attention', label:'Needs attention' },
  { id:'gate',      label:'Gate controls' },
];

function controlMatches(s, n, filter, flagged){
  const a = s.answers[n] || {};
  if (filter === 'open') return !a.v;
  if (filter === 'gate') return !!GATES_BY_CONTROL[n];
  if (filter === 'attention') return a.v === 'no' || needsRemark(a) || flagged.has(n);
  return true;
}
// Controls with an open AI finding worth the architect's attention
const flaggedControls = s => new Set(precheckFindings(s).filter(f => f.n && !f.dismissed && f.kind !== 'No evidence found').map(f => f.n));

function secStatus(s, id){
  useTemplate(s);
  if (id === 'info') {
    const done = INFO_FIELDS.filter(f => String(s.info[f.key] || '').trim()).length;
    return { done: done === INFO_FIELDS.length, text: done === INFO_FIELDS.length ? 'Complete' : `${done} of ${INFO_FIELDS.length}`, short:`${done}/${INFO_FIELDS.length}`, pct: done / INFO_FIELDS.length };
  }
  if (id === 'signoff') {
    const n = Object.keys(s.signoffs).length;
    return { done: n === SIGNOFFS.length, text: n === SIGNOFFS.length ? 'All signed' : `${n} of ${SIGNOFFS.length} signed`, short:`${n}/${SIGNOFFS.length}`, pct: n / SIGNOFFS.length };
  }
  const sec = SECTIONS.find(x => x.id === id);
  const total = sec.controls.length;
  const answered = sec.controls.filter(([n]) => s.answers[n]?.v).length;
  const no = sec.controls.filter(([n]) => s.answers[n]?.v === 'no').length;
  const missing = sec.controls.filter(([n]) => needsRemark(s.answers[n] || {})).length;
  const done = answered === total && !missing;
  const issues = [no && `${no} No`, missing && `${missing} need${missing > 1 ? '' : 's'} remark`].filter(Boolean).join(' · ');
  return { done, warn: no + missing, issues, text: done ? 'Complete' : `${answered} of ${total}`,
           short: done ? '✓' : `${answered}/${total}`, pct: answered / total };
}

function viewEditor(s){
  useTemplate(s);
  const locked = isLocked(s);
  let banner = '';
  if (s.status === 'Submitted') banner = `<div class="banner info">🔒 Submitted to Solution Lab — checklist is read-only. ${state.role === CHAIR ? 'Record the Lab decision in the <a href="#/s/'+s.id+'/signoff">Sign-off</a> section.' : 'Switch role to <b>Solution Lab Chair</b> to record a decision.'}</div>`;
  else if (s.status === 'Resubmission Required') banner = `<div class="banner warn">↩ Resubmission required: ${esc(s.decision?.comments)} ${state.role === 'Project Manager' ? '<button class="btn sm" data-action="reopen">Reopen as draft</button>' : '<span class="muted">(Project Manager can reopen as draft.)</span>'}</div>`;
  else if (s.status !== 'Draft') banner = `<div class="banner info">✔ Decision recorded: <b>${esc(s.status)}</b>. Record is read-only.</div>`;
  else if (state.role === CHAIR) banner = `<div class="banner info">Viewing as Solution Lab Chair — drafts are read-only.</div>`;

  return `
  <div class="crumbs"><a href="#/">← All submissions</a></div>
  <div class="page-head">
    <div><h1>${esc(s.info.project || 'Untitled submission')}</h1>
      <div class="sub"><span class="ctag" title="Checklist version this paper uses">${esc(tplLabel(s))}</span> ${esc(s.info.vendor || 'Vendor not set')} · ${s.id} · ${statusChip(s.status)}</div></div>
    <div class="actions">
      <a class="btn" href="#/print/${s.id}">Printable checklist</a>
      ${!locked ? `<button class="btn danger" data-action="delete">Delete</button>` : ''}
    </div>
  </div>
  ${banner}
  <div class="secbar" id="secbar">${renderSecbar(s)}</div>
  <div class="layout">
    <div class="form-stack" id="form">${renderForm(s)}</div>
    <aside id="aside">${renderAside(s)}</aside>
  </div>`;
}

function renderSecbar(s){
  const flagged = flaggedControls(s);
  const count = f => ALL_CONTROLS.filter(c => controlMatches(s, c.n, f, flagged)).length;
  const shown = SECS.filter(x => !ctx.hidden.has(x.id)).length;
  return `
    <nav class="chips" aria-label="Jump to section">
      ${SECS.map(x => { const st = secStatus(s, x.id);
        return `<button class="cn ${st.done ? 'done' : st.warn ? 'warn' : ''} ${ctx.active === x.id ? 'on' : ''} ${ctx.hidden.has(x.id) ? 'off' : ''}"
          data-action="jump" data-sec="${x.id}" title="${esc(x.name)} — ${esc(st.text)}${ctx.hidden.has(x.id) ? ' (hidden — click to show)' : ''}">
          <span class="k">${x.key}</span><span class="nm">${esc(x.short)}</span><span class="st">${esc(st.short)}</span></button>`; }).join('')}
    </nav>
    <div class="tools">
      <span class="muted" style="font-size:12.5px">Show</span>
      <div class="seg" role="group" aria-label="Filter controls">
        ${FILTERS.map(f => `<button data-action="filter" data-f="${f.id}" aria-pressed="${ctx.filter === f.id}">${f.label}<b>${count(f.id)}</b></button>`).join('')}
      </div>
      <details class="menu" id="secmenu">
        <summary class="btn sm">Sections · ${shown}/${SECS.length} shown ▾</summary>
        <div class="menu-pop">
          ${SECS.map(x => `<label><input type="checkbox" data-vis="${x.id}" ${ctx.hidden.has(x.id) ? '' : 'checked'}><span class="k-sm">${x.key}</span>${esc(x.name)}</label>`).join('')}
          <div class="mf"><button class="btn sm" data-action="showall">Show all</button><button class="btn sm" data-action="onlyopen">Only incomplete</button></div>
        </div>
      </details>
      <span class="spacer"></span>
      <button class="btn sm" data-action="collapseall">Collapse all</button>
      <button class="btn sm" data-action="expandall">Expand all</button>
    </div>`;
}

function renderForm(s){
  const visible = SECS.filter(x => !ctx.hidden.has(x.id));
  if (!visible.length) return `<div class="card empty">All sections are hidden. <button class="btn sm" data-action="showall">Show all sections</button></div>`;
  return `<div class="legend"><span><b>Yes</b> complied</span><span><b>No</b> describe gap, owner &amp; target date</span><span><b>N/A</b> justify why not applicable</span><span><span class="gtag" style="margin:0">GATE</span> mandatory gate evidence</span></div>` +
    visible.map(x => renderCard(s, x.id)).join('');
}

function renderCard(s, id){
  const collapsed = ctx.collapsed.has(id);
  return `<section class="card seccard ${collapsed ? 'collapsed' : ''}" id="sec-${id}" data-sec="${id}">
    ${renderCardHead(s, id)}
    <div class="sec-body">${renderCardBody(s, id, isLocked(s))}</div>
  </section>`;
}

function renderCardHead(s, id){
  const x = SECS.find(y => y.id === id), st = secStatus(s, id);
  const sec = SECTIONS.find(y => y.id === id);
  const meta = sec ? `${sec.controls.length} controls · ${sec.controls.filter(([n]) => GATES_BY_CONTROL[n]).length} gate controls`
    : id === 'info' ? 'Header details for the Solution Lab paper'
    : 'Owner sign-offs, Lab decision and activity';
  const collapsed = ctx.collapsed.has(id);
  return `<header class="sec-head ${st.done ? 'done' : ''}" id="head-${id}" data-action="toggle" data-sec="${id}">
    <button class="chev" aria-expanded="${!collapsed}" aria-controls="sec-${id}" aria-label="${collapsed ? 'Expand' : 'Collapse'} ${esc(x.name)}">▾</button>
    <span class="letter">${x.key}</span>
    <div class="t"><h2>${sec ? sec.id + '. ' : ''}${esc(x.name)}</h2><div class="meta">${meta}</div></div>
    ${st.issues ? `<span class="pill warn">${esc(st.issues)}</span>` : ''}
    <span class="pill ${st.done ? 'done' : st.warn && !sec ? 'warn' : ''}">${st.done ? '✓ ' : ''}${esc(st.text)}</span>
    <div class="bar mini ${st.done ? 'ok' : ''}" aria-hidden="true"><i style="width:${Math.round(st.pct * 100)}%"></i></div>
    <button class="icon-btn" data-action="hide" data-sec="${id}" title="Hide this section">Hide</button>
  </header>`;
}

function renderCardBody(s, id, locked){
  if (id === 'info') return `
    <div class="form">
      ${INFO_FIELDS.map(f => `<div class="field">
        <label for="f-${f.key}">${f.label} <span class="req">*</span></label>
        <input id="f-${f.key}" type="${f.type || 'text'}" data-info="${f.key}" value="${esc(s.info[f.key])}" ${locked ? 'readonly' : ''}>
      </div>`).join('')}
    </div>`;
  if (id === 'signoff') return renderSignoff(s, locked);

  const sec = SECTIONS.find(x => x.id === id);
  const flagged = flaggedControls(s);
  const rows = sec.controls.filter(([n]) => ctx.filter === 'all' || ctx.keep.has(+n) || controlMatches(s, n, ctx.filter, flagged));
  const open = sec.controls.some(([n]) => !s.answers[n]?.v);
  const tools = !locked && open ? `<div class="sec-tools"><button class="btn sm" data-action="fillyes" data-sec="${id}" title="Prototype shortcut">Mark unanswered as Yes</button></div>` : '';
  if (!rows.length) {
    const msg = { open:'Every control in this section is answered.', attention:'Nothing needs attention in this section.', gate:'No mandatory-gate controls in this section.' }[ctx.filter];
    return `<div class="filter-note">✓ ${msg} <button class="btn sm" data-action="filter" data-f="all">Show all controls</button></div>`;
  }
  const hiddenN = sec.controls.length - rows.length;
  return tools + rows.map(([n, t]) => {
      const a = s.answers[n] || {};
      const need = needsRemark(a);
      const tags = (GATES_BY_CONTROL[n] || []).map(g => `<span class="gtag" title="Evidence for mandatory gate">GATE · ${esc(g.name)}</span>`).join('');
      const ph = a.v === 'no' ? 'Required: describe the gap, remediation owner and target date'
               : a.v === 'na' ? 'Required: justify why this control is not applicable'
               : 'Remarks / evidence reference (optional)';
      return `<div class="ctl ${a.v || ''} ${need ? 'need' : ''}" id="c-${n}">
        <div class="n">${n}</div>
        <div>
          <div class="lbl">${esc(t)}${tags}</div>
          <input class="remark" data-remark="${n}" value="${esc(a.r)}" ${locked ? 'readonly' : ''} placeholder="${ph}" aria-label="Remarks for control ${n}">
          <div class="err">${a.v === 'na' ? 'Justification required for N/A.' : 'Remark required when not complied.'}</div>
          ${aiHint(s, n, locked)}
        </div>
        <div class="yn" role="group" aria-label="Complied for control ${n}">
          ${['yes','no','na'].map(v => `<button class="${v === 'yes' ? 'y' : v === 'no' ? 'x' : 'na'}" data-action="answer" data-n="${n}" data-v="${v}" aria-pressed="${a.v === v}" ${locked ? 'disabled' : ''}>${ANSWER_LABEL[v]}</button>`).join('')}
        </div>
      </div>`;
    }).join('') + (hiddenN ? `<div class="filter-note">${hiddenN} control(s) hidden by the “${FILTERS.find(f => f.id === ctx.filter).label}” filter.</div>` : '');
}

const needsRemark = a => (a.v === 'no' || a.v === 'na') && !(a.r || '').trim();

function aiHint(s, n, locked){
  const r = s.precheck?.results?.[n];
  if (!r) return '';
  const ask = `<button class="linkish" data-action="askctl" data-n="${n}">Ask AI</button>`;
  if (!r.suggest) return `<div class="ai-hint none"><span class="spark">✦</span> AI: no evidence found in the paper pack. ${ask}</div>`;
  const a = s.answers[n] || {};
  const conflict = a.v && a.v !== r.suggest;
  const apply = !locked && a.v !== r.suggest ? `<button class="btn sm" data-action="apply" data-n="${n}">Apply</button>` : '';
  return `<div class="ai-hint ${conflict ? 'conflict' : ''}"><span class="spark">✦</span>
    <span>AI suggests <b>${ANSWER_LABEL[r.suggest]}</b> (${r.conf}%)${conflict ? ' — <b>conflicts with your answer</b>' : ''} · ${esc(r.cite.doc)} p.${r.cite.page}: <q>${esc(r.cite.quote)}</q></span>${apply}${ask}</div>`;
}

/* ============================================================
   AI paper assistant (MOCK chatbot)
   Docked panel: upload PDFs → pre-check runs → ask follow-ups.
   Replies come from canned data and simple intent matching.
   ============================================================ */
const GATE_EXPECT = {
  casb:'User and administrator traffic both routed through CASB; diagram shows the admin path explicitly.',
  sso:'SAML/OIDC federation with Entra ID; no local accounts except documented break-glass.',
  mfa:'MFA enforced for all users via Entra ID Conditional Access, including admins.',
  pam:'Privileged access via PAM: approval workflow, credential injection and session recording documented.',
  rbac:'RBAC matrix attached; Business, User and System Admin roles are separated.',
  audit:'Audit log scope, retention period and export method stated.',
  siem:'Logs forwarded to the corporate SIEM, with the connector and subscription confirmed.',
  backup:'Who backs up, how restores are requested, and who owns recovery — named, not implied.',
  seg:'Tenant isolation model explained and independently validated (e.g. pen-test report).',
  support:'L1/L2/L3 owners named; reseller vs principal accountability agreed in writing.',
  exit:'Exit plan with export format, timeline and deletion certificate.',
  secarch:'Security Architecture Review completed and signed by the Security Architect.',
};
const GATE_WORDS = {
  casb:/\bcasb\b/, sso:/\b(sso|entra)\b/, mfa:/\bmfa\b/, pam:/\b(pam|privileged)\b/, rbac:/\b(rbac|roles?)\b/,
  audit:/\baudit\b/, siem:/\b(siem|monitoring)\b/, backup:/\b(backup|recovery|restore)\b/, seg:/\b(segregation|tenant|isolation)\b/,
  support:/\b(support|reseller)\b/, exit:/\b(exit|extraction)\b/, secarch:/security architecture/,
};

// SaaS gates have hand-written synonyms; other collections match on words in the gate name
const gateRegex = g => GATE_WORDS[g.id] || new RegExp(`\\b(${g.name.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 2 && !['and','the','for','with'].includes(w)).join('|') || '$^'})\\b`);
const chatSub = () => ctx.view === 'edit' && findSub(ctx.id);
const kb = n => (n / 1024 / 1024 >= 1 ? (n / 1024 / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');

function updateChatShell(){
  const s = chatSub();
  const open = !!s && ctx.chatOpen;
  $('#fab').hidden = !s || open;
  $('#chat').classList.toggle('open', open);
  $('#chat').setAttribute('aria-hidden', String(!open));
  document.body.classList.toggle('chat-open', open);
  if (!s) return;
  const pc = precheckSummary(s);
  $('#fab').innerHTML = `<span class="spark-w">✦</span> AI assistant ${
    !pc.ran ? '<span class="badge">Run check</span>' : pc.stale ? '<span class="badge">Stale</span>'
    : pc.blocking ? `<span class="badge">${pc.blocking} blocking</span>` : '<span class="badge ok">✓</span>'}`;
  if (open) renderChat(s);
}

function renderChat(s){
  useTemplate(s);
  const locked = isLocked(s), p = s.precheck || { docs:[] }, pc = precheckSummary(s);
  $('#chatsub').textContent = s.info.project || s.id;
  const status = !pc.ran ? '<span class="pill">Not checked</span>' : pc.stale ? '<span class="pill warn">Out of date</span>'
    : pc.blocking ? `<span class="pill warn">${pc.blocking} blocking</span>` : '<span class="pill done">✓ Clear</span>';
  $('#pack').innerHTML = p.docs.length
    ? `<details id="packd" ${ctx.packOpen ? 'open' : ''}><summary>📎 Paper pack · <b>${p.docs.length} PDF${p.docs.length > 1 ? 's' : ''}</b> ${status}<span class="spacer"></span>
        ${!locked && (pc.stale || !pc.ran) ? '<button class="btn sm primary" data-action="runcheck">Run pre-check</button>' : ''}</summary>
        <ul class="docs">${p.docs.map((d, i) => `<li>📄 <span class="dn">${esc(d.name)}</span><span class="dtype">${DOC_TYPES[d.type]}</span>${locked ? '' : `<button class="xbtn" data-action="rmdoc" data-i="${i}" aria-label="Remove ${esc(d.name)}">×</button>`}</li>`).join('')}</ul></details>`
    : `<span class="muted">No PDFs yet — attach the architecture, CRAT, RBAC, data flow, contract and exit plan.</span>`;

  const msgs = s.chat || [];
  const lastReport = msgs.map(m => m.kind).lastIndexOf('report');
  const html = greeting(s, locked) +
    msgs.map((m, i) => renderMsg(s, m, locked, i === lastReport)).join('') +
    (ctx.running?.id === s.id ? progressBubble() : '') +
    (ctx.typing ? '<div class="msg ai typing" aria-label="Assistant is typing"><span>●</span><span>●</span><span>●</span></div>' : '');
  const box = $('#msgs');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = html;
  const len = msgs.length + (ctx.typing ? 1 : 0) + (ctx.running ? 10 + ctx.running.step : 0);
  if (atBottom || len !== ctx.chatLen) box.scrollTop = box.scrollHeight;
  ctx.chatLen = len;

  const chips = !p.docs.length
    ? ['Use sample PDF pack', 'What does a standard paper need?']
    : !pc.ran || pc.stale ? ['Run pre-check', 'What does a standard paper need?']
    : ["What's blocking submission?", 'Summarise for committee', 'Check PAM gate', 'Explain control #13', 'Which artefacts are missing?'];
  $('#quick').innerHTML = chips.map(c => `<button type="button" data-action="ask" data-q="${esc(c)}">${esc(c)}</button>`).join('');
  $('[data-action="attach"]').disabled = locked;
}

function greeting(s, locked){
  return `<div class="msg ai"><p style="margin:0 0 6px">Hi ${esc(PERSONAS[state.role].split(' ')[0])} 👋 I review Solution Lab papers before they reach committee.</p>
    <ul class="tight">
      <li>${locked ? 'This paper is read-only — I can still explain findings and draft a committee brief.' : '<b>Attach PDFs</b> (📎 or drag &amp; drop) — I map the evidence to all ${ALL_CONTROLS.length} ${esc(s.template.name)} standards and flag gaps.'}</li>
      <li>Ask about a control (<i>“#22”</i>), a gate (<i>“PAM”</i>), <i>“what’s blocking?”</i> or <i>“summarise for committee”</i>.</li>
    </ul></div>`;
}

function progressBubble(){
  const i = ctx.running.step;
  return `<div class="msg ai"><b><span class="spark">✦</span> Running pre-check…</b>
    <ul class="steps" style="padding:8px 0 4px">${precheckSteps().map((t, k) => `<li class="${k < i ? 'done' : k === i ? 'cur' : ''}">${k < i ? '✔' : k === i ? '◌' : '·'} ${t}</li>`).join('')}</ul>
    <div class="bar"><i style="width:${i / precheckSteps().length * 100}%;transition:width .3s"></i></div></div>`;
}

function renderMsg(s, m, locked, liveReport){
  if (m.role === 'user') {
    if (m.kind === 'files') return `<div class="msg user">${m.files.map(f => `<div class="file">📄 ${esc(f.name)} <span style="opacity:.75">· ${kb(f.size)}</span></div>`).join('')}</div>`;
    return `<div class="msg user">${esc(m.text)}</div>`;
  }
  const body = {
    text:      () => m.html,
    report:    () => liveReport ? reportBody(s, locked) : `Pre-check result at ${fmtTime(m.at)}: score <b>${m.snap.score}</b> · ${m.snap.blocking} blocking · ${m.snap.major} major · ${m.snap.minor} minor. <span class="muted">(superseded)</span>`,
    blockers:  () => blockersBody(s),
    control:   () => controlBody(s, m.n, locked),
    gate:      () => gateBody(s, m.g),
    summary:   () => summaryBody(s),
    artefacts: () => artefactBody(s),
  }[m.kind];
  return `<div class="msg ai">${body ? body() : ''}</div>`;
}

function findingItem(s, f, locked){
  const p = s.precheck, r = f.n && p.results[f.n];
  const canApply = !locked && r?.suggest && s.answers[f.n]?.v !== r.suggest && !f.dismissed;
  return `<div class="finding ${f.dismissed ? 'dismissed' : ''}">
    <div class="fh"><span class="sev ${f.sev}">${f.sev}</span><b>${esc(f.kind)}</b>${f.n ? `<span class="muted">#${f.n}</span>` : ''}</div>
    <div>${esc(f.msg)}</div>
    ${r?.cite ? `<div class="cite"><b>${esc(r.cite.doc)} · p.${r.cite.page}</b> — “${esc(r.cite.quote)}” (${r.conf}%)</div>` : ''}
    ${f.dismissed ? `<div class="muted" style="font-size:12px">Overridden by ${esc(f.dismissed.by)}: “${esc(f.dismissed.reason)}”</div>` : ''}
    <div class="actions">
      ${canApply ? `<button class="btn sm primary" data-action="apply" data-n="${f.n}">Apply ${ANSWER_LABEL[r.suggest]}</button>` : ''}
      ${f.n ? `<button class="btn sm" data-action="gotoctl" data-n="${f.n}">Go to #${f.n}</button>` : ''}
      ${!locked && f.sev !== 'minor' && !f.dismissed ? `<button class="btn sm" data-action="dismiss" data-f="${f.id}">Override…</button>` : ''}
      ${!locked && f.dismissed ? `<button class="btn sm" data-action="undismiss" data-f="${f.id}">Undo override</button>` : ''}
    </div></div>`;
}

function reportBody(s, locked){
  const pc = precheckSummary(s), p = s.precheck;
  const all = precheckFindings(s);
  const shown = ctx.allFindings ? all : all.slice(0, 5);
  const suggestable = ALL_CONTROLS.filter(c => !s.answers[c.n]?.v && p.results[c.n]?.suggest && p.results[c.n].conf >= 80).length;
  const ok = !pc.blocking;
  return `<div class="verdict ${ok ? 'ok' : 'no'}"><div class="big">${pc.score}</div>
      <div><b>${ok ? (pc.major ? 'Committee-ready with gaps' : 'Committee-ready') : 'Not committee-ready'}</b>
      <span class="muted">${pc.blocking} blocking · ${pc.major} major · ${pc.minor} minor</span></div></div>
    ${pc.stale ? '<div class="banner warn" style="margin:6px 0">The paper pack changed since this run — re-run the pre-check.</div>' : ''}
    ${!locked && suggestable ? `<button class="btn sm" data-action="applyall" style="margin:4px 0">Fill ${suggestable} unanswered control(s) from evidence (≥80%)</button>` : ''}
    ${shown.map(f => findingItem(s, f, locked)).join('') || '<p>No findings — paper meets the standard. ✓</p>'}
    ${all.length > 5 ? `<button class="btn sm" data-action="morefindings" style="margin-top:6px">${ctx.allFindings ? 'Show fewer' : `Show all ${all.length} findings`}</button>` : ''}`;
}

function blockersBody(s){
  const m = metrics(s);
  if (s.status !== 'Draft') return `This paper is <b>${esc(s.status)}</b> — nothing is blocking.`;
  if (m.ready) return `Nothing is blocking. ✓ The Project Manager can sign &amp; submit in <button class="linkish" data-action="jump" data-sec="signoff">Sign-off section</button>.`;
  return `<b>${m.blockers.length} thing(s) stop this paper going to committee:</b>
    <ol class="tight">${m.blockers.map(b => `<li>${esc(b)}</li>`).join('')}</ol>
    ${m.gFail.length ? `Start with the failing gates: ${m.gFail.map(g => `<button class="btn sm" data-action="goto" data-gate="${g.id}">${esc(g.name)}</button>`).join(' ')}` : ''}`;
}

function controlBody(s, n, locked){
  const c = ALL_CONTROLS.find(x => x.n === n), a = s.answers[n] || {}, r = s.precheck?.results?.[n];
  const gates = GATES_BY_CONTROL[n] || [];
  let ai;
  if (!r) ai = 'The pre-check has not been run, so I have no evidence for this control yet.';
  else if (!r.suggest) ai = 'I found <b>no evidence</b> for this in the paper pack. Attach the relevant document, or answer manually with a reference.';
  else ai = `The evidence suggests <b>${ANSWER_LABEL[r.suggest]}</b> (${r.conf}% confidence)${r.note ? ` — ${esc(r.note)}` : ''}.
    <div class="cite"><b>${esc(r.cite.doc)} · p.${r.cite.page}</b> — “${esc(r.cite.quote)}”</div>
    ${a.v && a.v !== r.suggest ? `<div style="margin-top:6px">⚠ This <b>conflicts</b> with the current answer (${ANSWER_LABEL[a.v]}). The committee will ask about it.</div>` : ''}`;
  return `<b>#${n} · ${esc(c.t)}</b>
    <div class="muted" style="font-size:12px">Section ${c.section}${gates.length ? ` · evidence for gate: ${gates.map(g => esc(g.name)).join(', ')}` : ''}</div>
    <p style="margin:8px 0 4px"><b>Current answer:</b> ${a.v ? ANSWER_LABEL[a.v] : 'not answered'}${a.r ? ` — <i>${esc(a.r)}</i>` : ''}</p>
    <div>${ai}</div>
    ${gates[0]?.expect ? `<p style="margin:8px 0 0"><b>What the committee expects:</b> ${esc(gates[0].expect)}</p>` : ''}
    <div class="actions" style="margin-top:8px">
      ${!locked && r?.suggest && a.v !== r.suggest ? `<button class="btn sm primary" data-action="apply" data-n="${n}">Apply ${ANSWER_LABEL[r.suggest]}</button>` : ''}
      <button class="btn sm" data-action="gotoctl" data-n="${n}">Go to #${n}</button></div>`;
}

function gateBody(s, gid){
  const g = GATES.find(x => x.id === gid), st = gateStatus(s, g);
  return `<b>Mandatory gate · ${esc(g.name)}</b> — ${st === 'pass' ? '<span style="color:var(--ok)">✓ passing</span>' : st === 'fail' ? '<span style="color:var(--bad)">✕ failing</span>' : 'pending'}

      ${g.signoff ? `<li>Security Architect sign-off — <b>${s.signoffs[g.signoff] ? 'signed' : 'pending'}</b></li>` : ''}</ul>
    ${g.expect ? `<b>What the committee expects:</b> ${esc(g.expect)}` : ''}`;
}

function artefactBody(s){
  const docs = s.precheck?.docs || [];
  return `<b>A standard Solution Lab paper includes these artefacts:</b>
    <ul class="tight">${REQUIRED_ARTEFACTS.map(t => { const d = docs.find(x => x.type === t);
      return `<li>${d ? '✔' : '✕'} ${DOC_TYPES[t]}${d ? ` — <span class="muted">${esc(d.name)}</span>` : ' — <b>missing</b>'}</li>`; }).join('')}</ul>
    <span class="muted">Plus all ${ALL_CONTROLS.length} standards answered, a remark on every No / N/A, and all ${GATES.length} mandatory gates passing.</span>`;
}

function briefText(s){
  const m = metrics(s), pc = precheckSummary(s);
  const nos = ALL_CONTROLS.filter(c => s.answers[c.n]?.v === 'no');
  const nas = ALL_CONTROLS.filter(c => s.answers[c.n]?.v === 'na');

  return { m, pc, nos, nas, ov };
}
function summaryBody(s){
  const { m, pc, nos, nas, ov } = briefText(s);
  return `<b>Committee brief — ${esc(s.info.project || s.id)}</b>
    <div class="muted" style="font-size:12px">${esc(s.info.vendor || '—')} · Lab date ${fmtDate(s.info.labDate)}</div>
    <ul class="tight">
      <li>Checklist: ${m.answered}/${m.total} answered (${m.yes} Yes · ${m.no} No · ${m.na} N/A)</li>
      <li>Mandatory gates: <b>${m.gPass}/${m.gates.length}</b> passing${m.gFail.length ? ` — failing: ${m.gFail.map(g => esc(g.name)).join(', ')}` : ''}</li>
      <li>AI pre-check: ${pc.ran ? `score ${pc.score}, ${pc.blocking} blocking / ${pc.major} major open${pc.stale ? ' (out of date)' : ''}` : 'not run'}</li>
    </ul>
    ${nos.length ? `<b>Non-compliances</b><ul class="tight">${nos.map(c => `<li>#${c.n} ${esc(c.t)} — <i>${esc(s.answers[c.n].r || 'no remark')}</i></li>`).join('')}</ul>` : ''}
    ${nas.length ? `<b>Not applicable</b><ul class="tight">${nas.map(c => `<li>#${c.n} ${esc(c.t)} — <i>${esc(s.answers[c.n].r || 'no justification')}</i></li>`).join('')}</ul>` : ''}
    ${ov.length ? `<b>Overridden AI findings</b><ul class="tight">${ov.map(f => `<li>${f.n ? '#' + f.n + ' ' : ''}${esc(f.kind)} — <i>${esc(f.dismissed.reason)}</i></li>`).join('')}</ul>` : ''}
    <button class="btn sm" data-action="copybrief">Copy brief</button>`;

/* ---------- conversation ---------- */
function pushMsg(s, msg){ (s.chat ||= []).push({ at:Date.now(), ...msg }); touch(s); }
function aiSay(s, msg, delay = 450){
  ctx.typing = true; if (chatSub()?.id === s.id) renderChat(s);
  setTimeout(() => {
    ctx.typing = false; pushMsg(s, { role:'ai', ...msg });
    if (chatSub()?.id === s.id) renderChat(s);
  }, delay);
}

function handleAsk(s, q){
  useTemplate(s);
  pushMsg(s, { role:'user', kind:'text', text:q }); renderChat(s);
  const t = q.toLowerCase();
  const pc = precheckSummary(s);
  const ctl = t.match(/(?:#|control\s*|no\.?\s*)(\d{1,2})\b/) || t.match(/^\s*(\d{1,2})\s*$/);
  const gate = GATES.find(g => gateRegex(g).test(t))?.id;
  if (/sample/.test(t)) return addPdfs(s, SAMPLE_PACK.map(name => ({ name, size:180000 + name.length * 9000, type:'application/pdf' })));
  if (ctl && +ctl[1] >= 1 && +ctl[1] <= ALL_CONTROLS.length) return aiSay(s, { kind:'control', n:+ctl[1] });
  if (gate) return aiSay(s, { kind:'gate', g:gate });
  if (/\b(run|re-?run|pre-?check|check|scan|analy[sz]e)\b/.test(t)) {
    if (!s.precheck?.docs?.length) return aiSay(s, { kind:'text', html:'Attach the paper-pack PDFs first (📎 below), or try the <button class="linkish" data-action="ask" data-q="Use sample PDF pack">sample PDF pack</button>.' });
    if (isLocked(s)) return aiSay(s, { kind:'text', html:'This paper is read-only, so I can’t re-run the pre-check on it.' });
    return runPrecheck(s);
  }
  if (/block|ready|submit|why can|stop/.test(t)) return aiSay(s, { kind:'blockers' });
  if (/summar|committee|brief|exec/.test(t)) return aiSay(s, { kind:'summary' });
  if (/artefact|artifact|document|standard|need|require|missing/.test(t)) return aiSay(s, { kind:'artefacts' });
  if (/help|what can you|how/.test(t)) return aiSay(s, { kind:'text', html:'I can: run the pre-check on attached PDFs, explain a control (<i>“#7”</i>), check a gate (<i>“CASB”</i>, <i>“backup”</i>), list what’s blocking submission, list required artefacts, and draft a committee brief.' });
  aiSay(s, { kind:'text', html:`I’m a prototype, so I only understand a few kinds of question. Try one of the suggestions below${pc.ran ? '' : ', or attach PDFs to start'}.` });
}

function addPdfs(s, files){
  if (isLocked(s)) return aiSay(s, { kind:'text', html:'This paper is read-only — attachments can’t be added.' });
  const list = [...files];
  const pdfs = list.filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  const rejected = list.filter(f => !pdfs.includes(f));
  const p = s.precheck ||= { docs:[], dismissed:{} };
  const fresh = pdfs.filter(f => !p.docs.some(d => d.name === f.name));
  if (pdfs.length) pushMsg(s, { role:'user', kind:'files', files:pdfs.map(f => ({ name:f.name, size:f.size })) });
  fresh.forEach(f => p.docs.push({ name:f.name, type:inferType(f.name), size:f.size }));
  touch(s); ctx.packOpen = false; updateChatShell(); refreshChrome(s);
  if (!fresh.length) {
    const why = rejected.length ? `Only PDF files are supported — skipped ${rejected.map(f => esc(f.name)).join(', ')}.` : 'Those PDFs are already in the paper pack.';
    return aiSay(s, { kind:'text', html:why });
  }
  aiSay(s, { kind:'text', html:`Got ${fresh.length} PDF${fresh.length > 1 ? 's' : ''}. I classified them as:
    <ul class="tight">${fresh.map(f => `<li>${esc(f.name)} → <b>${DOC_TYPES[inferType(f.name)]}</b></li>`).join('')}</ul>
    ${rejected.length ? `<span class="muted">Skipped (not PDF): ${rejected.map(f => esc(f.name)).join(', ')}</span><br>` : ''}Running the pre-check now…` }, 400);
  setTimeout(() => runPrecheck(s), 900);
}

function runPrecheck(s){
  if (ctx.running) return;
  const p = s.precheck;
  ctx.running = { step:0, id:s.id }; renderChat(s);
  const tick = () => {
    ctx.running.step++;
    if (ctx.running.step < precheckSteps().length) { if (chatSub()?.id === s.id) renderChat(s); return setTimeout(tick, 500); }
    ctx.running = null; ctx.allFindings = false;
    p.results = runMockEngine(s, p.docs); p.ranAt = Date.now(); p.ranSig = docSig(p.docs);
    const pc = precheckSummary(s);
    log(s, `Ran AI pre-check (${p.docs.length} PDFs): ${pc.blocking} blocking, ${pc.major} major, ${pc.minor} minor`);
    pushMsg(s, { role:'ai', kind:'report', snap:{ score:pc.score, blocking:pc.blocking, major:pc.major, minor:pc.minor } });
    afterChange(s);
  };
  setTimeout(tick, 500);
}

function afterChange(s){
  touch(s);
  if (chatSub()?.id === s.id) { rerenderForm(s); updateChatShell(); }
}

function renderSignoff(s, locked){
  const m = metrics(s);
  const rows = SIGNOFFS.map(x => {
    const so = s.signoffs[x.id];
    const mine = state.role === x.owner;
    let cell;
    if (so) {
      cell = `<div class="signed">✔ ${esc(so.name)}<small>${fmtTime(so.at)}</small></div>`;
      if (mine && s.status === 'Draft') cell += `<button class="btn sm" data-action="revoke" data-so="${x.id}">Revoke</button>`;
    } else if (s.status !== 'Draft') {
      cell = `<span class="muted">—</span>`;
    } else if (x.id === 'pm') {
      cell = mine
        ? `<button class="btn primary sm" data-action="sign" data-so="pm" ${m.ready ? '' : 'disabled'}>Sign &amp; submit to Solution Lab</button>`
        : `<span class="muted">Awaiting ${x.owner}</span>`;
    } else {
      cell = mine ? `<button class="btn primary sm" data-action="sign" data-so="${x.id}">Sign off</button>` : `<span class="muted">Awaiting ${x.owner}</span>`;
    }
    return `<div class="so"><div><b>${x.item}</b></div><div class="muted">${x.owner}</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${cell}</div></div>`;
  }).join('');

  const blockers = s.status === 'Draft' && !m.ready
    ? `<ul class="blockers">${m.blockers.map(b => `<li>${esc(b)}${/AI pre-check/.test(b) ? ' <button class="linkish" data-action="chatopen">Open AI assistant →</button>' : ''}</li>`).join('')}</ul>` : '';

  let decision;
  if (s.decision) {
    decision = `<div class="decision"><div>${statusChip(s.decision.outcome)} <span class="muted">by ${esc(s.decision.by)} · ${fmtTime(s.decision.at)}</span></div>
      ${s.decision.comments ? `<div><b>Key conditions / comments</b><div>${esc(s.decision.comments)}</div></div>` : ''}</div>`;
  } else if (s.status === 'Submitted' && state.role === CHAIR) {
    decision = `<div class="decision">
      <div class="opts">${DECISIONS.map(d => `<label class="opt"><input type="radio" name="dec" value="${d}"> ${d}</label>`).join('')}</div>
      <div class="field"><label for="decc">Key conditions / comments</label><textarea id="decc" rows="3" placeholder="Required for “Approved with Conditions” and “Resubmission Required”"></textarea></div>
      <div><button class="btn primary" data-action="decide">Record decision</button></div></div>`;
  } else {
    decision = `<div class="decision muted">${s.status === 'Submitted' ? 'Awaiting Solution Lab Chair decision.' : 'Available once the Project Manager submits the paper to Solution Lab.'}</div>`;
  }

  return `
    <div class="card-desc"><div class="muted">Each owner signs off in their role. The Project Manager’s sign-off submits the paper — only allowed when all mandatory gates pass.</div></div>
    <div class="so h"><span>Validation item</span><span>Owner</span><span>Sign-off</span></div>
    ${rows}${blockers}
    <div class="panel-head" style="border-top:1px solid var(--border)"><div><h2>Solution Lab decision</h2></div></div>
    ${decision}
    <div class="panel-head" style="border-top:1px solid var(--border)"><div><h2>Activity</h2></div></div>
    <ul class="history">${[...s.history].reverse().map(h => `<li><span class="muted num-tab">${fmtTime(h.at)}</span><span><b>${esc(h.who)}</b> — ${esc(h.what)}</span></li>`).join('')}</ul>`;
}

function render(){
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  const s = parts[1] && findSub(parts[1]);
  const hash = location.hash || '#/';
  const keepScroll = hash === ctx.lastHash;
  const y = window.scrollY;
  ctx.lastHash = hash;
  observer?.disconnect();
  if (parts[0] === 's' && s) {
    if (ctx.id !== s.id) { ctx.keep = new Set(); ctx.active = 'info'; }
    ctx = { ...ctx, view:'edit', id:s.id };
    $('#view').innerHTML = viewEditor(s);
    measureChrome(); watchSections();
    if (parts[2]) { history.replaceState(null, '', `#/s/${s.id}`); ctx.lastHash = `#/s/${s.id}`; requestAnimationFrame(() => jumpTo(parts[2])); }
    else window.scrollTo(0, keepScroll ? y : 0);
  } else if (parts[0] === 'print' && s) {
    ctx = { ...ctx, view:'print', id:s.id };
    $('#view').innerHTML = viewPrint(s); window.scrollTo(0, 0);
  } else if (parts[0] === 'admin' && parts[1] && findCol(parts[1])) {
    if (ctx.colId !== parts[1]) { ctx.editStd = null; if (ctx.addTo && !findCol(parts[1]).draft.sections.some(x => x.id === ctx.addTo)) ctx.addTo = null; }
    ctx = { ...ctx, view:'admincol', id:null, colId:parts[1] };
    $('#view').innerHTML = viewCollection(findCol(parts[1]));
    measureChrome(); window.scrollTo(0, keepScroll ? y : 0);
  } else if (parts[0] === 'admin') {
    ctx = { ...ctx, view:'admin', id:null, colId:null };
    $('#view').innerHTML = viewLibrary(); window.scrollTo(0, keepScroll ? y : 0);
  } else {
    ctx = { ...ctx, view:'dash', id:null };
    $('#view').innerHTML = viewDashboard();
  }
  const area = ctx.view.startsWith('admin') ? 'admin' : 'dash';
  document.querySelectorAll('.topnav a').forEach(a => a.setAttribute('aria-current', a.dataset.nav === area ? 'page' : 'false'));
  updateChatShell();
}
/* Update nav, summary and section headers without touching the form body (keeps focus) */
function refreshChrome(s){
  if (ctx.view !== 'edit') return;
  useTemplate(s);
  const menuOpen = $('#secmenu')?.open;
  $('#secbar').innerHTML = renderSecbar(s);
  if (menuOpen) $('#secmenu').open = true;
  $('#aside').innerHTML = renderAside(s);
  SECS.forEach(x => { const h = $(`#head-${x.id}`); if (h) h.outerHTML = renderCardHead(s, x.id); });
  measureChrome(); updateChatShell();
}
function rerenderCard(s, id){
  useTemplate(s);
  const el = $(`#sec-${id}`);
  if (el) { el.outerHTML = renderCard(s, id); observer?.observe($(`#sec-${id}`)); }
}
function rerenderForm(s){
  if (ctx.view !== 'edit' || ctx.id !== s.id) return;
  useTemplate(s);
  observer?.disconnect();
  $('#form').innerHTML = renderForm(s);
  refreshChrome(s); watchSections();
}
function measureChrome(){
  const r = document.documentElement.style;
  r.setProperty('--tb', $('.topbar').offsetHeight + 'px');
  const sb = $('#secbar') || $('#pubbar'); if (sb) r.setProperty('--sb', sb.offsetHeight + 'px');
}
function jumpTo(id){
  const s = findSub(ctx.id);
  const changed = ctx.hidden.delete(id) | ctx.collapsed.delete(id);
  if (changed) { savePrefs(); rerenderForm(s); }
  const el = $(`#sec-${id}`); if (!el) return;
  ctx.active = id; refreshChrome(s);
  el.scrollIntoView({ behavior:'smooth', block:'start' });
}
/* Scroll-spy: highlight the chip of the section currently in view */
let observer;
function watchSections(){
  if (!('IntersectionObserver' in window)) return;
  const top = $('.topbar').offsetHeight + ($('#secbar')?.offsetHeight || 0);
  observer = new IntersectionObserver(entries => {
    const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (!vis || vis.target.dataset.sec === ctx.active) return;
    ctx.active = vis.target.dataset.sec;
    document.querySelectorAll('.cn').forEach(c => c.classList.toggle('on', c.dataset.sec === ctx.active));
    $(`.cn[data-sec="${ctx.active}"]`)?.scrollIntoView({ block:'nearest', inline:'nearest' });
  }, { rootMargin:`-${top + 4}px 0px -60% 0px` });
  document.querySelectorAll('.seccard').forEach(c => observer.observe(c));
}
/* Per-viewer layout preferences (hidden / collapsed sections) */
function loadPrefs(){
  let p = {}; try { p = JSON.parse(localStorage.getItem('tacs.viewprefs') || '{}'); } catch {}
  ctx.hidden = new Set(p.hidden || []); ctx.collapsed = new Set(p.collapsed || []);
}
function savePrefs(){
  try { localStorage.setItem('tacs.viewprefs', JSON.stringify({ hidden:[...ctx.hidden], collapsed:[...ctx.collapsed] })); } catch {}
}
function go(hash){ if (location.hash === hash) render(); else location.hash = hash; }

/* ============================================================
   Actions
   ============================================================ */
const actions = {
  open:   el => go(`#/s/${el.dataset.id}`),
  jump:   el => { $('#secmenu')?.removeAttribute('open'); jumpTo(el.dataset.sec); },
  toggle(el){
    const id = el.dataset.sec;
    ctx.collapsed.has(id) ? ctx.collapsed.delete(id) : ctx.collapsed.add(id);
    savePrefs();
    $(`#sec-${id}`).classList.toggle('collapsed', ctx.collapsed.has(id));
    $(`#head-${id} .chev`).setAttribute('aria-expanded', !ctx.collapsed.has(id));
  },
  hide(el){ ctx.hidden.add(el.dataset.sec); savePrefs(); rerenderForm(findSub(ctx.id)); toast('Section hidden — restore it from “Sections”'); },
  show(el){ jumpTo(el.dataset.sec); },
  showall(){ ctx.hidden.clear(); savePrefs(); rerenderForm(findSub(ctx.id)); },
  onlyopen(){
    const s = findSub(ctx.id);
    ctx.hidden = new Set(SECS.filter(x => secStatus(s, x.id).done).map(x => x.id));
    savePrefs(); rerenderForm(s); toast(`Showing ${SECS.length - ctx.hidden.size} incomplete section(s)`);
  },
  collapseall(){ SECS.forEach(x => ctx.collapsed.add(x.id)); savePrefs(); rerenderForm(findSub(ctx.id)); },
  expandall(){ ctx.collapsed.clear(); savePrefs(); rerenderForm(findSub(ctx.id)); },
  filter(el){
    ctx.filter = el.dataset.f; ctx.keep = new Set();
    // a filter is pointless on collapsed control sections — open them
    if (ctx.filter !== 'all') SECTIONS.forEach(x => ctx.collapsed.delete(x.id));
    savePrefs(); rerenderForm(findSub(ctx.id));
  },
  new(){ chooseChecklistModal(); },
  answer(el){
    const s = findSub(ctx.id); if (isLocked(s)) return;
    const n = el.dataset.n, v = el.dataset.v;
    const a = s.answers[n] || { v:null, r:'' };
    a.v = a.v === v ? null : v;           // click again to clear
    s.answers[n] = a; touch(s);
    ctx.keep.add(+n);   // don't let the active filter whisk the row away mid-edit
    rerenderCard(s, ALL_CONTROLS.find(c => c.n === +n).section);
    refreshChrome(s);
    if (needsRemark(a)) $(`[data-remark="${n}"]`)?.focus();
  },
  fillyes(el){ /* prototype shortcut */
    const s = findSub(ctx.id);
    SECTIONS.find(x => x.id === el.dataset.sec).controls.forEach(([n]) => { if (!s.answers[n]?.v) { s.answers[n] = { v:'yes', r:s.answers[n]?.r || '' }; ctx.keep.add(n); } });
    touch(s); rerenderCard(s, el.dataset.sec); refreshChrome(s);
  },
  chatopen(){ ctx.chatOpen = true; updateChatShell(); setTimeout(() => $('#chatin')?.focus(), 220); },
  chatclose(){ ctx.chatOpen = false; updateChatShell(); $('#fab')?.focus(); },
  attach(){ $('#pdfs').click(); },
  ask(el){ const s = findSub(ctx.id); ctx.chatOpen = true; updateChatShell(); handleAsk(s, el.dataset.q); },
  askctl(el){ const s = findSub(ctx.id); ctx.chatOpen = true; updateChatShell(); handleAsk(s, `Explain control #${el.dataset.n}`); },
  morefindings(){ ctx.allFindings = !ctx.allFindings; renderChat(findSub(ctx.id)); },
  runcheck(){ runPrecheck(findSub(ctx.id)); },
  rmdoc(el){
    const s = findSub(ctx.id); const [d] = s.precheck.docs.splice(+el.dataset.i, 1);
    ctx.packOpen = true; log(s, `Removed ${d.name} from paper pack`); afterChange(s);
  },
  apply(el){
    const s = findSub(ctx.id); if (isLocked(s)) return;
    const n = el.dataset.n, r = s.precheck.results[n];
    const ref = `[Ref: ${r.cite.doc} p.${r.cite.page}]`;
    s.answers[n] = { v:r.suggest, r:r.note ? `${r.note}. ${ref}` : ref };
    ctx.keep.add(+n); afterChange(s); toast(`#${n} set to ${ANSWER_LABEL[r.suggest]}`);
  },
  applyall(){
    const s = findSub(ctx.id); let k = 0;
    ALL_CONTROLS.forEach(({ n }) => { const r = s.precheck.results[n];
      if (!s.answers[n]?.v && r.suggest && r.conf >= 80) { s.answers[n] = { v:r.suggest, r:(r.note ? r.note + '. ' : '') + `[Ref: ${r.cite.doc} p.${r.cite.page}]` }; ctx.keep.add(n); k++; } });
    log(s, `Applied ${k} AI suggestion(s)`); afterChange(s); toast(`Filled ${k} control(s) — review before sign-off`);
  },
  dismiss(el){
    const s = findSub(ctx.id);
    const reason = (prompt('Reason for overriding this finding (shown to the committee):') || '').trim();
    if (!reason) return toast('Override cancelled — a reason is required');
    (s.precheck.dismissed ||= {})[el.dataset.f] = { reason, by:PERSONAS[state.role], at:Date.now() };
    log(s, `Overrode AI finding ${el.dataset.f}: ${reason}`); afterChange(s);
  },
  undismiss(el){ const s = findSub(ctx.id); delete s.precheck.dismissed[el.dataset.f]; afterChange(s); },
  copybrief(){
    const s = findSub(ctx.id); const { m, pc, nos, nas, ov } = briefText(s);
    const lines = [`Committee brief — ${s.info.project || s.id}`, `${s.info.vendor || '—'} · Lab date ${fmtDate(s.info.labDate)}`,
      `${tplLabel(s)} · Checklist ${m.answered}/${m.total} · Gates ${m.gPass}/${m.gates.length} · AI pre-check ${pc.ran ? 'score ' + pc.score : 'not run'}`,
      ...(nos.length ? ['Non-compliances:', ...nos.map(c => `- #${c.n} ${c.t}: ${s.answers[c.n].r}`)] : []),
      ...(nas.length ? ['Not applicable:', ...nas.map(c => `- #${c.n} ${c.t}: ${s.answers[c.n].r}`)] : []),
      ...(ov.length ? ['Overridden AI findings:', ...ov.map(f => `- ${f.n ? '#' + f.n + ' ' : ''}${f.kind}: ${f.dismissed.reason}`)] : [])];
    navigator.clipboard?.writeText(lines.join('\n')).then(() => toast('Brief copied'), () => toast('Copy not available'));
  },
  gotoctl(el){
    if (matchMedia('(max-width:1099px)').matches) { ctx.chatOpen = false; updateChatShell(); }
    actions.goto(el);
  },
  goto(el){
    const s = findSub(ctx.id);
    const g = GATES.find(x => x.id === el.dataset.gate);
    const target = el.dataset.n ? +el.dataset.n : g.controls.find(n => s.answers[n]?.v !== 'yes') ?? (g.signoff && !s.signoffs[g.signoff] ? 'signoff' : g.controls[0]);
    if (target === 'signoff') return jumpTo('signoff');
    const sec = ALL_CONTROLS.find(c => c.n === target).section;
    let changed = ctx.hidden.delete(sec) | ctx.collapsed.delete(sec);
    if (ctx.filter !== 'all' && !ctx.keep.has(target)) { ctx.keep.add(target); changed = true; }
    if (changed) { savePrefs(); rerenderForm(s); }
    requestAnimationFrame(() => setTimeout(() => {
      const row = $(`#c-${target}`); if (!row) return;
      row.scrollIntoView({ behavior:'smooth', block:'center' });
      row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
    }, 30));
  },
  sign(el){
    const s = findSub(ctx.id); const x = SIGNOFFS.find(y => y.id === el.dataset.so);
    if (x.id === 'pm' && !metrics(s).ready) return toast('Resolve blockers before submitting');
    s.signoffs[x.id] = { name:PERSONAS[state.role], at:Date.now() };
    log(s, `Signed off: ${x.item}`);
    if (x.id === 'pm') { s.status = 'Submitted'; log(s, 'Submitted to Solution Lab'); toast('Submitted to Solution Lab'); }
    else toast('Signed off');
    touch(s); render();
  },
  revoke(el){
    const s = findSub(ctx.id); const x = SIGNOFFS.find(y => y.id === el.dataset.so);
    delete s.signoffs[x.id]; log(s, `Revoked sign-off: ${x.item}`); touch(s); render();
  },
  decide(){
    const s = findSub(ctx.id);
    const outcome = $('input[name="dec"]:checked')?.value;
    const comments = $('#decc').value.trim();
    if (!outcome) return toast('Choose a decision');
    if (outcome !== 'Approved' && !comments) { $('#decc').focus(); return toast('Comments are required for this decision'); }
    s.decision = { outcome, comments, by:PERSONAS[CHAIR], at:Date.now() };
    s.status = outcome; log(s, `Decision: ${outcome}`); touch(s); render(); toast(`Recorded: ${outcome}`);
  },
  reopen(){
    const s = findSub(ctx.id);
    s.status = 'Draft'; delete s.signoffs.pm;
    s.history.push({ at:Date.now(), who:actor(), what:`Reopened as draft (previous decision: ${s.decision.outcome})` });
    s.decision = null; touch(s); render(); toast('Reopened as draft');
  },
  delete(){
    const s = findSub(ctx.id);
    if (!confirm(`Delete “${s.info.project || s.id}”? This cannot be undone.`)) return;
    state.subs = state.subs.filter(x => x.id !== s.id); save(); go('#/'); toast('Submission deleted');
  },
  reset(){
    if (!confirm('Reset all data to the demo set?')) return;
    const role = state.role; state = seed(); state.role = role; save(); render(); toast('Demo data restored');
  },
  export(){
    const blob = new Blob([JSON.stringify({ collections:state.collections, submissions:state.subs }, null, 2)], { type:'application/json' });
    const a = Object.assign(document.createElement('a'), { href:URL.createObjectURL(blob), download:'tacs-submissions.json' });
    a.click(); URL.revokeObjectURL(a.href);
