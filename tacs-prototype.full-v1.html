/* ============================================================
   Standards library admin
   Flow: Library overview → Collection editor (draft) → Review & publish
   ============================================================ */
const isAdmin = () => state.role === ADMIN;
const findCol = id => state.collections.find(c => c.id === id);
const usage = c => state.subs.filter(s => s.template.colId === c.id);
const isDirty = c => c.version === 0 || JSON.stringify(c.draft) !== JSON.stringify(c.published);
const countStd = def => def.sections.reduce((a, s) => a + s.controls.length, 0);
const adminActor = () => `${state.role} · ${PERSONAS[state.role]}`;

function colState(c){
  if (c.status === 'archived') return { cls:'draft', label:'Archived' };
  if (c.version === 0) return { cls:'conditions', label:'Never published' };
  if (isDirty(c)) return { cls:'conditions', label:'Unpublished changes' };
  return { cls:'approved', label:`Published v${c.version}` };
}

/* What changed between the published version and the draft */
function diffCollection(c){
  const P = c.version ? c.published : { sections:[], gates:[], artefacts:[] }, D = c.draft;
  const items = [];
  const flat = def => new Map(def.sections.flatMap(s => s.controls.map(k => [k.id, { text:k.text, sec:s.title }])));
  const pc = flat(P), dc = flat(D);
  dc.forEach((v, id) => { if (!pc.has(id)) items.push({ t:'add', label:`Standard added in “${v.sec}”: ${v.text || '(empty)'}` });
                          else if (pc.get(id).text !== v.text) items.push({ t:'edit', label:`Standard reworded: ${v.text}` }); });
  pc.forEach((v, id) => { if (!dc.has(id)) items.push({ t:'remove', label:`Standard removed: ${v.text}` }); });
  const ps = new Map(P.sections.map(s => [s.id, s])), ds = new Map(D.sections.map(s => [s.id, s]));
  ds.forEach((s, id) => { if (!ps.has(id)) items.push({ t:'add', label:`Section added: ${s.title || '(untitled)'}` });
                          else if (ps.get(id).title !== s.title || (ps.get(id).short || '') !== (s.short || '')) items.push({ t:'edit', label:`Section renamed: ${s.title}` }); });
  ps.forEach((s, id) => { if (!ds.has(id)) items.push({ t:'remove', label:`Section removed: ${s.title}` }); });
  const order = def => def.sections.map(s => s.id + ':' + s.controls.map(k => k.id).join(',')).join('|');
  const sameSet = [...dc.keys()].every(k => pc.has(k)) && pc.size === dc.size && ds.size === ps.size;
  if (sameSet && order(P) !== order(D)) items.push({ t:'edit', label:'Sections or standards reordered' });
  const pg = new Map(P.gates.map(g => [g.id, g])), dg = new Map(D.gates.map(g => [g.id, g]));
  dg.forEach((g, id) => { if (!pg.has(id)) items.push({ t:'add', label:`Gate added: ${g.name}` });
                          else if (JSON.stringify(pg.get(id)) !== JSON.stringify(g)) items.push({ t:'edit', label:`Gate changed: ${g.name}` }); });
  pg.forEach((g, id) => { if (!dg.has(id)) items.push({ t:'remove', label:`Gate removed: ${g.name}` }); });
  if ([...P.artefacts].sort().join() !== [...D.artefacts].sort().join()) items.push({ t:'edit', label:'Required artefacts changed' });
  return items;
}

function validateCollection(c){
  const D = c.draft, errs = [];
  if (!c.name.trim()) errs.push('Collection needs a name.');
  if (!D.sections.length) errs.push('Add at least one section.');
  D.sections.forEach((s, i) => {
    if (!s.title.trim()) errs.push(`Section ${i + 1} has no title.`);
    if (!s.controls.length) errs.push(`Section “${s.title || i + 1}” has no standards.`);
    if (s.controls.some(k => !k.text.trim())) errs.push(`Section “${s.title}” has an empty standard.`);
  });
  D.gates.forEach(g => {
    if (!g.name.trim()) errs.push('A gate has no name.');
    if (!g.controls.length) errs.push(`Gate “${g.name}” is not linked to any standard.`);
  });
  return errs;
}

/* ---------- Collection editor ---------- */
function viewCollection(c){
  const ro = !isAdmin();
  const D = c.draft;
  let no = 0;
  const sections = D.sections.map((sec, si) => {
    const letter = String.fromCharCode(65 + si);
    const rows = sec.controls.map((k, ki) => {
      no++;
      const gates = D.gates.filter(g => g.controls.includes(k.id));
      const editing = ctx.editStd === k.id && !ro;
      return `<div class="std ${editing ? 'editing' : ''}" id="std-${k.id}">
        <span class="sn">${no}</span>
        <div class="sbody">
          ${editing
            ? `<textarea class="stdedit" data-std="${k.id}" rows="2" aria-label="Standard text">${esc(k.text)}</textarea>
               <div class="hint">Enter to save · Shift+Enter for a new line · Esc to cancel</div>`
            : `<div class="stext">${esc(k.text) || '<i class="muted">Empty standard</i>'}</div>`}
          ${gates.length ? `<div>${gates.map(g => `<span class="gtag" style="margin:4px 4px 0 0">GATE · ${esc(g.name)}</span>`).join('')}</div>` : ''}
        </div>
        ${ro ? '' : editing
          ? `<div class="sact on"><button class="btn sm primary" data-action="stdsave" data-std="${k.id}">Save</button><button class="btn sm" data-action="stdcancel">Cancel</button></div>`
          : `<div class="sact">
              <button class="icon-btn" data-action="stdedit" data-std="${k.id}" title="Edit" aria-label="Edit standard ${no}">✎</button>
              <button class="icon-btn" data-action="stdmove" data-std="${k.id}" data-d="-1" ${ki === 0 ? 'disabled' : ''} title="Move up" aria-label="Move standard ${no} up">↑</button>
              <button class="icon-btn" data-action="stdmove" data-std="${k.id}" data-d="1" ${ki === sec.controls.length - 1 ? 'disabled' : ''} title="Move down" aria-label="Move standard ${no} down">↓</button>
              <button class="icon-btn danger" data-action="stddel" data-std="${k.id}" title="Delete" aria-label="Delete standard ${no}">🗑</button>
            </div>`}
      </div>`;
    }).join('');
    const adding = ctx.addTo === sec.id && !ro;
    return `<section class="adm-sec" id="asec-${sec.id}">
      <header class="adm-sh">
        <span class="letter">${letter}</span>
        <div class="sh-fields">
          <input class="sh-title" data-sectitle="${sec.id}" value="${esc(sec.title)}" placeholder="Section title" ${ro ? 'readonly' : ''} aria-label="Section ${letter} title">
          <input class="sh-short" data-secshort="${sec.id}" value="${esc(sec.short || '')}" placeholder="Short label for navigation" ${ro ? 'readonly' : ''} aria-label="Section ${letter} short label">
        </div>
        <span class="pill">${sec.controls.length} standard${sec.controls.length === 1 ? '' : 's'}</span>
        ${ro ? '' : `<button class="icon-btn" data-action="secmove" data-sec="${sec.id}" data-d="-1" ${si === 0 ? 'disabled' : ''} aria-label="Move section up" title="Move up">↑</button>
          <button class="icon-btn" data-action="secmove" data-sec="${sec.id}" data-d="1" ${si === D.sections.length - 1 ? 'disabled' : ''} aria-label="Move section down" title="Move down">↓</button>
          <button class="icon-btn danger" data-action="secdel" data-sec="${sec.id}" aria-label="Delete section" title="Delete section">🗑</button>`}
      </header>
      ${rows || '<div class="filter-note">No standards yet.</div>'}
      ${ro ? '' : adding
        ? `<div class="std addrow"><span class="sn">${no + 1}</span><div class="sbody"><textarea class="stdnew" data-sec="${sec.id}" rows="2" placeholder="Type the standard, press Enter to add the next one…" aria-label="New standard"></textarea>
            <div class="hint">Enter adds and starts the next one · Esc to finish</div></div>
            <div class="sact on"><button class="btn sm primary" data-action="stdadd" data-sec="${sec.id}">Add</button><button class="btn sm" data-action="stdaddclose">Done</button></div></div>`
        : `<button class="addlink" data-action="stdaddopen" data-sec="${sec.id}">＋ Add standard</button>`}
    </section>`;
  }).join('');

  const gates = D.gates.map(g => {
    const nums = g.controls.map(id => stdNumber(D, id)).filter(Boolean).sort((a, b) => a - b);
    return `<div class="gate-row">
      <div style="flex:1;min-width:0"><b>${esc(g.name) || '<i class="muted">Unnamed gate</i>'}</b> ${g.signoff ? '<span class="pill">+ Security sign-off</span>' : ''}
        <div class="muted" style="font-size:12.5px">${nums.length ? 'Evidenced by #' + nums.join(', #') : '<span style="color:var(--bad)">Not linked to any standard</span>'}</div>
        ${g.expect ? `<div style="font-size:13px;margin-top:2px">${esc(g.expect)}</div>` : ''}</div>
      ${ro ? '' : `<div class="sact"><button class="icon-btn" data-action="gateedit" data-gate="${g.id}" aria-label="Edit gate ${esc(g.name)}" title="Edit">✎</button>
        <button class="icon-btn danger" data-action="gatedel" data-gate="${g.id}" aria-label="Delete gate ${esc(g.name)}" title="Delete">🗑</button></div>`}
    </div>`;
  }).join('');

  const arts = Object.keys(DOC_TYPES).filter(t => t !== 'other').map(t => `<label class="toggle ${D.artefacts.includes(t) ? 'on' : ''}">
      <input type="checkbox" data-art="${t}" ${D.artefacts.includes(t) ? 'checked' : ''} ${ro ? 'disabled' : ''}> ${DOC_TYPES[t]}</label>`).join('');

  const st = colState(c), used = usage(c);
  return `
  <div class="crumbs"><a href="#/admin">← Standards library</a></div>
  <div class="page-head">
    <div style="flex:1;min-width:240px">
      <input class="title-input" data-cfield="name" value="${esc(c.name)}" ${ro ? 'readonly' : ''} aria-label="Collection name">
      <input class="desc-input" data-cfield="description" value="${esc(c.description)}" placeholder="Describe when this checklist applies" ${ro ? 'readonly' : ''} aria-label="Collection description">
    </div>
    <div class="actions">
      <span class="chip ${st.cls}" id="colchip">${st.label}</span>
      ${ro ? '' : `<button class="btn" data-action="dupcol">Duplicate</button>
        <button class="btn" data-action="archivecol">${c.status === 'archived' ? 'Restore' : 'Archive'}</button>
        <button class="btn danger" data-action="delcol" ${used.length ? `disabled title="Used by ${used.length} paper(s) — archive it instead"` : ''}>Delete</button>`}
    </div>
  </div>
  ${ro ? `<div class="banner info">Read-only. Switch role to <b>${ADMIN}</b> to edit this collection.</div>` : ''}
  <div class="pubbar" id="pubbar">${renderPubbar(c)}</div>
  <div class="layout">
    <div class="form-stack">
      <div class="card">
        <div class="panel-head"><div><h2>Sections &amp; standards</h2><div class="muted">${countStd(D)} standards in ${D.sections.length} sections. Numbering follows the order shown here.</div></div>
          ${ro ? '' : '<button class="btn sm" data-action="secadd">＋ Add section</button>'}</div>
        <div class="adm-secs">${sections || '<div class="empty">No sections yet.</div>'}</div>
      </div>
      <div class="card" id="agates">
        <div class="panel-head"><div><h2>Mandatory gates</h2><div class="muted">A paper fails the gate if any linked standard is answered “No”. Fail any gate = not ready for Solution Lab.</div></div>
          ${ro ? '' : '<button class="btn sm" data-action="gateedit">＋ Add gate</button>'}</div>
        ${gates || '<div class="empty">No mandatory gates.</div>'}
      </div>
      <div class="card" id="aarts">
        <div class="panel-head"><div><h2>Required artefacts</h2><div class="muted">Documents the AI pre-check expects in every paper pack for this collection.</div></div></div>
        <div class="toggles">${arts}</div>
      </div>
    </div>
    <aside>
      <div class="card pad">
        <h3>Outline</h3>
        <ul class="sumlist" style="border:0;margin:0;padding:0">
          ${D.sections.map((s, i) => `<li><button class="go" data-action="ajump" data-target="asec-${s.id}"><span class="k">${String.fromCharCode(65 + i)}</span><span class="nm">${esc(s.short || s.title || 'Untitled')}</span><span class="st">${s.controls.length}</span></button></li>`).join('')}
          <li><button class="go" data-action="ajump" data-target="agates"><span class="k">◆</span><span class="nm">Mandatory gates</span><span class="st">${D.gates.length}</span></button></li>
          <li><button class="go" data-action="ajump" data-target="aarts"><span class="k">📎</span><span class="nm">Required artefacts</span><span class="st">${D.artefacts.length}</span></button></li>
        </ul>
      </div>
      <div class="card pad">
        <h3>Usage</h3>
        ${used.length ? `<ul class="tight" style="padding-left:18px;margin:0">${used.map(s => `<li><a href="#/s/${s.id}">${esc(s.info.project || s.id)}</a> <span class="muted">· v${s.template.version}</span></li>`).join('')}</ul>` : '<p class="muted" style="margin:0">Not used by any paper yet.</p>'}
      </div>
      <div class="card pad">
        <h3>Version history</h3>
        ${c.history.length ? `<ul class="history" style="padding:0">${[...c.history].reverse().map(h => `<li><span class="muted num-tab">${fmtDate(h.at)}</span><span>${esc(h.what)}<br><small class="muted">${esc(h.who)}</small></span></li>`).join('')}</ul>` : '<p class="muted" style="margin:0">Not published yet.</p>'}
      </div>
    </aside>
  </div>`;
}

function stdNumber(def, id){
  let n = 0;
  for (const s of def.sections) for (const k of s.controls) { n++; if (k.id === id) return n; }
  return 0;
}

function renderPubbar(c){
  const diff = diffCollection(c);
  if (c.version === 0) return `<span><b>Draft — never published.</b> Architects can’t pick this checklist until you publish it.</span><span class="spacer"></span>
    ${isAdmin() ? '<button class="btn primary" data-action="reviewpub">Review &amp; publish v1</button>' : ''}`;
  if (!diff.length) return `<span class="muted">Published <b>v${c.version}</b> on ${fmtDate(c.publishedAt)} · no unpublished changes.</span>`;
  return `<span><b>${diff.length} unpublished change${diff.length === 1 ? '' : 's'}</b> — new papers still use v${c.version}.</span><span class="spacer"></span>
    ${isAdmin() ? `<button class="btn" data-action="discard">Discard changes</button><button class="btn primary" data-action="reviewpub">Review &amp; publish v${c.version + 1}</button>` : ''}`;
}
function refreshAdminChrome(c){
  $('#pubbar').innerHTML = renderPubbar(c);
  const st = colState(c), chip = $('#colchip');
  if (chip) { chip.className = `chip ${st.cls}`; chip.textContent = st.label; }
}

/* ---------- Modals ---------- */
function openModal(html, wide){
  const m = $('#modal');
  m.innerHTML = `<div class="modal card ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden = false; ctx.modalReturn = document.activeElement;
  setTimeout(() => m.querySelector('input:not([type=checkbox]):not([type=radio]),textarea,button')?.focus(), 30);
}
function closeModal(){
  const m = $('#modal'); m.hidden = true; m.innerHTML = '';
  ctx.modalReturn?.focus?.();
}

function gateModal(c, g){
  const D = c.draft;
  let n = 0;
  const picker = D.sections.map((s, i) => `<fieldset class="pick"><legend>${String.fromCharCode(65 + i)}. ${esc(s.title)}</legend>
    ${s.controls.map(k => { n++; return `<label data-text="${esc(k.text.toLowerCase())}"><input type="checkbox" name="gctl" value="${k.id}" ${g?.controls.includes(k.id) ? 'checked' : ''}> <span class="muted">#${n}</span> ${esc(k.text)}</label>`; }).join('')}
  </fieldset>`).join('');
  openModal(`
    <div class="modal-h"><h2>${g ? 'Edit gate' : 'New mandatory gate'}</h2><button class="icon-btn" data-action="mclose" aria-label="Close">✕</button></div>
    <div class="modal-b">
      <div class="field"><label for="gname">Gate name <span class="req">*</span></label><input id="gname" value="${esc(g?.name || '')}" placeholder="e.g. Encryption"></div>
      <div class="field"><label for="gexp">What the committee expects</label><textarea id="gexp" rows="2" placeholder="Shown to architects and used by the AI assistant">${esc(g?.expect || '')}</textarea></div>
      <label class="check"><input type="checkbox" id="gsign" ${g?.signoff ? 'checked' : ''}> Also requires the Security Architect’s sign-off</label>
      <div class="field"><label for="gsearch">Evidenced by these standards <span class="req">*</span></label>
        <input id="gsearch" type="search" placeholder="Filter standards…">
        <div class="picker" id="gpicker">${picker}</div></div>
    </div>
    <div class="modal-f"><span class="muted" id="gcount"></span><span class="spacer"></span><button class="btn" data-action="mclose">Cancel</button><button class="btn primary" data-action="gatesave" data-gate="${g?.id || ''}">${g ? 'Save gate' : 'Add gate'}</button></div>`, true);
  updateGateCount();
}
function updateGateCount(){ const el = $('#gcount'); if (el) el.textContent = `${document.querySelectorAll('[name=gctl]:checked').length} standard(s) selected`; }

function publishModal(c){
  const diff = diffCollection(c), errs = validateCollection(c), used = usage(c);
  const icon = { add:'＋', edit:'✎', remove:'−' };
  openModal(`
    <div class="modal-h"><h2>Publish ${esc(c.name)} v${c.version + 1}</h2><button class="icon-btn" data-action="mclose" aria-label="Close">✕</button></div>
    <div class="modal-b">
      ${errs.length ? `<div class="banner warn" style="display:block"><b>Fix these before publishing:</b><ul class="tight">${errs.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}
      <h3>Changes${c.version ? ` since v${c.version}` : ''}</h3>
      <ul class="difflist">${(c.version ? diff : [{ t:'add', label:`${countStd(c.draft)} standards in ${c.draft.sections.length} sections, ${c.draft.gates.length} gates` }])
        .map(d => `<li class="${d.t}"><span>${icon[d.t]}</span>${esc(d.label)}</li>`).join('')}</ul>
      <h3>Impact</h3>
      <p style="margin-top:0">New papers will use <b>v${c.version + 1}</b>. ${used.length ? `${used.length} existing paper(s) stay on the version they started with.` : 'No existing papers are affected.'}</p>
      <div class="field"><label for="pnote">Change note <span class="req">*</span></label><textarea id="pnote" rows="2" placeholder="Why is this changing? e.g. Added AI data-leakage standard after Sept review"></textarea></div>
    </div>
    <div class="modal-f"><span class="spacer"></span><button class="btn" data-action="mclose">Cancel</button>
      <button class="btn primary" data-action="publish" ${errs.length ? 'disabled' : ''}>Publish v${c.version + 1}</button></div>`, true);
}

function newColModal(){
  const pub = state.collections.filter(c => c.version > 0);
  openModal(`
    <div class="modal-h"><h2>New collection</h2><button class="icon-btn" data-action="mclose" aria-label="Close">✕</button></div>
    <div class="modal-b">
      <div class="field"><label for="ncname">Name <span class="req">*</span></label><input id="ncname" placeholder="e.g. Data Platform"></div>
      <div class="field"><label for="ncdesc">When does it apply?</label><input id="ncdesc" placeholder="e.g. Analytics and data-lake workloads"></div>
      <div class="field"><label>Start from</label>
        <label class="check"><input type="radio" name="ncfrom" value="" checked> Blank collection</label>
        ${pub.map(c => `<label class="check"><input type="radio" name="ncfrom" value="${c.id}"> Copy of ${esc(c.name)} <span class="muted">(${countStd(c.published)} standards)</span></label>`).join('')}
      </div>
    </div>
    <div class="modal-f"><span class="spacer"></span><button class="btn" data-action="mclose">Cancel</button><button class="btn primary" data-action="createcol">Create draft</button></div>`);

function chooseChecklistModal(){
  const cols = state.collections.filter(c => c.status === 'active' && c.version > 0);
  openModal(`
    <div class="modal-h"><h2>Which checklist applies?</h2><button class="icon-btn" data-action="mclose" aria-label="Close">✕</button></div>
    <div class="modal-b"><p class="muted" style="margin-top:0">Pick the collection of standards for this solution. You can’t change it later.</p>
      <div class="choose">${cols.map(c => `<button class="card colcard" data-action="newfrom" data-col="${c.id}">
        <div class="ch"><span class="colicon">${esc(c.name.slice(0, 2).toUpperCase())}</span><div><b>${esc(c.name)}</b> <span class="muted">v${c.version}</span></div></div>
        <p class="muted">${esc(c.description)}</p>
        <div class="colstats"><span><b>${countStd(c.published)}</b> standards</span><span><b>${c.published.gates.length}</b> gates</span></div></button>`).join('')}</div>

}

/* ---------- Admin mutations ---------- */
function withCol(fn){
  const c = findCol(ctx.colId); if (!c || !isAdmin()) return;
  fn(c); save(); render();
}
function undoable(c, msg, mutate){
  const before = clone(c.draft);
  mutate(); save(); render();
  toast(msg, () => { c.draft = before; save(); render(); toast('Restored'); });
}
function findStd(D, id){
  for (const s of D.sections) { const i = s.controls.findIndex(k => k.id === id); if (i >= 0) return { sec:s, i, k:s.controls[i] }; }
}
function commitStdEdit(){
  const ta = $('.stdedit'); if (!ta) return;
  const c = findCol(ctx.colId), hit = findStd(c.draft, ta.dataset.std);
  const v = ta.value.trim();
  if (!v) return toast('A standard can’t be empty — delete it instead');
  hit.k.text = v; ctx.editStd = null; save(); render();
}
function commitStdNew(keepOpen){
  const ta = $('.stdnew'); if (!ta) return;
  const v = ta.value.trim(), c = findCol(ctx.colId);
  if (v) c.draft.sections.find(s => s.id === ta.dataset.sec).controls.push({ id:rid('k'), text:v });
  if (!keepOpen) ctx.addTo = null;
  save(); render();
  if (keepOpen) $('.stdnew')?.focus();
}

const adminActions = {
  opencol: el => go(`#/admin/${el.dataset.col}`),
  togglearchived(){ ctx.showArchived = !ctx.showArchived; render(); },
  newcol(){ newColModal(); },
  createcol(){
    const name = $('#ncname').value.trim();
    if (!name) { $('#ncname').focus(); return toast('Give the collection a name'); }
    const from = findCol($('input[name=ncfrom]:checked')?.value);
    const def = from ? clone(from.published) : { sections:[{ id:rid('sec'), title:'General', short:'General', controls:[] }], gates:[], artefacts:['arch'] };
    const c = { id:rid('col'), name, description:$('#ncdesc').value.trim(), status:'active', version:0, publishedAt:null,
                published:{ sections:[], gates:[], artefacts:[] }, draft:def, history:[] };
    state.collections.push(c); save(); closeModal();
    if (!from) ctx.addTo = def.sections[0].id;
    go(`#/admin/${c.id}`);
    toast(from ? `Copied ${from.name} — edit, then publish` : 'Draft created — add your first standards');
  },
  dupcol(){
    const src = findCol(ctx.colId);
    const c = { ...clone(src), id:rid('col'), name:src.name + ' (copy)', status:'active', version:0, publishedAt:null,
                published:{ sections:[], gates:[], artefacts:[] }, draft:clone(src.draft), history:[] };
    state.collections.push(c); save(); go(`#/admin/${c.id}`); toast('Duplicated as a new draft');
  },
  archivecol(){ withCol(c => { c.status = c.status === 'archived' ? 'active' : 'archived';
    c.history.push({ at:Date.now(), who:adminActor(), what:c.status === 'archived' ? 'Archived' : 'Restored' });
    toast(c.status === 'archived' ? 'Archived — no longer offered for new papers' : 'Restored'); }); },
  delcol(){
    const c = findCol(ctx.colId);
    if (usage(c).length) return toast('In use — archive it instead');
    if (!confirm(`Delete “${c.name}”? This cannot be undone.`)) return;
    state.collections = state.collections.filter(x => x !== c); save(); go('#/admin'); toast('Collection deleted');
  },
  discard(){
    const c = findCol(ctx.colId);
    undoable(c, 'Changes discarded', () => { c.draft = clone(c.published); ctx.editStd = ctx.addTo = null; });
  },
  reviewpub(){ publishModal(findCol(ctx.colId)); },
  publish(){
    const c = findCol(ctx.colId), note = $('#pnote').value.trim();
    if (validateCollection(c).length) return;
    if (!note) { $('#pnote').focus(); return toast('Add a change note'); }
    const changes = c.version ? diffCollection(c).length : null;
    c.version++; c.published = clone(c.draft); c.publishedAt = Date.now();
    c.history.push({ at:Date.now(), who:adminActor(), what:`Published v${c.version}${changes ? ` (${changes} change${changes > 1 ? 's' : ''})` : ''}: ${note}` });
    save(); closeModal(); render(); toast(`${c.name} v${c.version} published`);
  },
  secadd(){ withCol(c => { const s = { id:rid('sec'), title:'New section', short:'', controls:[] }; c.draft.sections.push(s); ctx.addTo = s.id; });
    setTimeout(() => { const i = $(`[data-sectitle="${ctx.addTo}"]`); i?.focus(); i?.select(); }, 30); },
  secmove(el){ withCol(c => { const a = c.draft.sections, i = a.findIndex(s => s.id === el.dataset.sec), j = i + +el.dataset.d; [a[i], a[j]] = [a[j], a[i]]; }); },
  secdel(el){
    const c = findCol(ctx.colId), sec = c.draft.sections.find(s => s.id === el.dataset.sec);
    undoable(c, `Section “${sec.title}” deleted`, () => {
      const ids = sec.controls.map(k => k.id);
      c.draft.sections = c.draft.sections.filter(s => s !== sec);
      c.draft.gates.forEach(g => g.controls = g.controls.filter(id => !ids.includes(id)));
    });
  },
  stdedit(el){ ctx.editStd = el.dataset.std; ctx.addTo = null; render(); const t = $('.stdedit'); t?.focus(); t?.setSelectionRange(t.value.length, t.value.length); },
  stdsave(){ commitStdEdit(); },
  stdcancel(){ ctx.editStd = null; render(); },
  stdmove(el){ withCol(c => { const { sec, i } = findStd(c.draft, el.dataset.std), a = sec.controls, j = i + +el.dataset.d; [a[i], a[j]] = [a[j], a[i]]; }); },
  stddel(el){
    const c = findCol(ctx.colId), { sec, k } = findStd(c.draft, el.dataset.std);
    undoable(c, 'Standard deleted', () => {
      sec.controls = sec.controls.filter(x => x !== k);
      c.draft.gates.forEach(g => g.controls = g.controls.filter(id => id !== k.id));
    });
  },
  stdaddopen(el){ ctx.addTo = el.dataset.sec; ctx.editStd = null; render(); $('.stdnew')?.focus(); },
  stdadd(){ commitStdNew(true); },
  stdaddclose(){ commitStdNew(false); },
  gateedit(el){ const c = findCol(ctx.colId); gateModal(c, c.draft.gates.find(g => g.id === el.dataset.gate)); },
  gatesave(el){
    const c = findCol(ctx.colId), name = $('#gname').value.trim();
    const controls = [...document.querySelectorAll('[name=gctl]:checked')].map(i => i.value);
    if (!name) { $('#gname').focus(); return toast('Name the gate'); }
    if (!controls.length) return toast('Link at least one standard');
    const data = { name, expect:$('#gexp').value.trim(), signoff:$('#gsign').checked, controls };
    const g = c.draft.gates.find(x => x.id === el.dataset.gate);
    g ? Object.assign(g, data) : c.draft.gates.push({ id:rid('g'), ...data });
    save(); closeModal(); render(); toast(g ? 'Gate updated' : 'Gate added');
  },
  gatedel(el){
    const c = findCol(ctx.colId), g = c.draft.gates.find(x => x.id === el.dataset.gate);
    undoable(c, `Gate “${g.name}” deleted`, () => { c.draft.gates = c.draft.gates.filter(x => x !== g); });
  },
  ajump(el){ document.getElementById(el.dataset.target)?.scrollIntoView({ behavior:'smooth', block:'start' }); },
  mclose(){ closeModal(); },
  newfrom(el){
    const c = findCol(el.dataset.col);
    const s = { id:uid(), status:'Draft', template:snapshot(c), info:Object.fromEntries(INFO_FIELDS.map(f => [f.key,''])),
                answers:{}, signoffs:{}, decision:null, history:[], updatedAt:Date.now() };
    log(s, `Created submission (${c.name} v${c.version})`);
    state.subs.push(s); save(); closeModal(); go(`#/s/${s.id}`);
  },
};

/* Admin keyboard & inline-field handling */
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList?.contains('stdedit')) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitStdEdit(); }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); ctx.editStd = null; render(); }
  } else if (t.classList?.contains('stdnew')) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitStdNew(true); }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); commitStdNew(false); }
  } else if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
}, true);
document.addEventListener('input', e => {
  const t = e.target, c = ctx.view === 'admincol' && findCol(ctx.colId);
  if (t.id === 'gsearch') {
    const q = t.value.toLowerCase();
    document.querySelectorAll('#gpicker label').forEach(l => l.hidden = q && !l.dataset.text.includes(q));
    return;
  }
  if (!c || !isAdmin()) return;
  if (t.dataset.cfield) { c[t.dataset.cfield] = t.value; save(); }
  else if (t.dataset.sectitle) { c.draft.sections.find(s => s.id === t.dataset.sectitle).title = t.value; save(); refreshAdminChrome(c); }
  else if (t.dataset.secshort) { c.draft.sections.find(s => s.id === t.dataset.secshort).short = t.value; save(); refreshAdminChrome(c); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'gctl') return updateGateCount();
  const c = ctx.view === 'admincol' && findCol(ctx.colId);
  if (c && isAdmin() && t.dataset.art) {
    const a = c.draft.artefacts;
    t.checked ? a.push(t.dataset.art) : a.splice(a.indexOf(t.dataset.art), 1);
    t.closest('.toggle').classList.toggle('on', t.checked);
    save(); refreshAdminChrome(c);
  }
});

Object.assign(actions, adminActions);

/* chat composer, drag & drop, keyboard */
$('#composer').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#chatin').value.trim(); if (!q) return;
  $('#chatin').value = ''; $('#chatin').style.height = '';
  handleAsk(findSub(ctx.id), q);
});
$('#chatin').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#composer').requestSubmit(); } });
$('#chatin').addEventListener('input', e => { e.target.style.height = ''; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; });
$('#chat').addEventListener('toggle', e => { if (e.target.id === 'packd') ctx.packOpen = e.target.open; }, true);
['dragenter','dragover'].forEach(ev => $('#chat').addEventListener(ev, e => { e.preventDefault(); $('#chat').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('#chat').addEventListener(ev, e => {
  e.preventDefault();
  if (ev === 'dragleave' && $('#chat').contains(e.relatedTarget)) return;
  $('#chat').classList.remove('over');
  if (ev === 'drop' && e.dataTransfer.files.length) addPdfs(findSub(ctx.id), e.dataTransfer.files);
}));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ctx.chatOpen && $('#modal').hidden) actions.chatclose(); });

/* role switcher + theme */
function initChrome(){
  const sel = $('#roleSel');
  sel.innerHTML = ROLES.map(r => `<option value="${r}">${r} — ${PERSONAS[r]}</option>`).join('');
  sel.value = state.role;
  sel.addEventListener('change', () => { state.role = sel.value; save(); render(); toast(`Now acting as ${state.role}`); });
  let theme = null; try { theme = localStorage.getItem('tacs.theme'); } catch {}
  if (theme) document.documentElement.dataset.theme = theme;
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('tacs.theme', next); } catch {}
  });
}

state = load();
ctx.filter = 'all'; ctx.keep = new Set(); loadPrefs();
initChrome();
window.addEventListener('resize', measureChrome);
window.addEventListener('hashchange', render);
render();
</script>
</body>
